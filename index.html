<style>
:root{
  --ink:#1d2330; --muted:#545b69; --line:#d6dae3; --line2:#e8ebf0; --bg:#f4f5f8; --card:#fff;
  --accent:#6b4fbb; --accent-ink:#6b4fbb; --accent-soft:#efeaf9;
  --ok:#1d6b41; --ok-bg:#e2f3e9; --warn:#7f4500; --warn-bg:#fff0d9; --err:#a3261b; --err-bg:#fdecea;
  --r:12px; --r-s:10px; --tap:44px; --fs:16px; --fs-s:13px; --fs-l:20px;
  --sp1:4px; --sp2:8px; --sp3:16px; --sp4:24px; --sp5:32px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.06);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 var(--font);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
[hidden]{display:none !important}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:var(--fs-l)} h2{font-size:var(--fs-l);font-weight:650} h3{font-size:var(--fs);font-weight:650}
p{margin:0 0 var(--sp2)}
a{color:var(--accent-ink)}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)} .small{font-size:var(--fs-s)}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px}
.skip:focus{top:8px}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline-offset:0}

/* ---------- controls ---------- */
button,.btn{font:inherit;font-size:var(--fs-s);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-s);min-height:var(--tap);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover{background:#f7f8fa}
button:disabled{opacity:.5;cursor:default}
button.primary,.btn.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{background:var(--err);border-color:var(--err);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:rgba(0,0,0,.05)}
button.link{background:none;border:none;color:var(--accent-ink);text-decoration:underline;padding:0 8px;min-width:var(--tap)}
button.icon{width:var(--tap);min-width:var(--tap);padding:0;background:transparent;border-color:transparent;color:var(--muted)}
button.icon:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
input[type=text],input[type=password],input[type=email],input[type=search],input[type=url],input[type=date],textarea,select{
  font:inherit;font-size:var(--fs);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--r-s);
  min-height:var(--tap);padding:9px 11px;width:100%;max-width:100%}
textarea{resize:none;display:block;line-height:1.4;field-sizing:content;overflow:hidden}
select{padding-right:28px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
::placeholder{color:#6a7180;opacity:1}
label.field{display:block;font-size:var(--fs-s);font-weight:600;margin:0 0 var(--sp1)}
.cb{width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;margin:0}
.cb input{width:22px;height:22px;margin:0;accent-color:var(--accent-ink);cursor:pointer}

/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:var(--sp5) var(--sp3)}
.login-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:var(--sp4);width:100%;max-width:420px}
.login-card h1{margin-bottom:var(--sp1)}
.login-card h1 span{color:var(--muted);font-weight:500}
.team-pick{display:grid;gap:var(--sp2);margin:var(--sp2) 0 var(--sp3)}
.team-pick label{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:2px solid var(--line);border-radius:var(--r);cursor:pointer;font-weight:600}
.team-pick input{width:20px;height:20px;accent-color:var(--tc)}
.team-pick label:has(input:checked){border-color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,#fff)}
.team-pick label:has(input:focus-visible){outline:3px solid var(--tc);outline-offset:2px}
.tdot{width:14px;height:14px;border-radius:50%;background:var(--tc,var(--accent));flex:0 0 auto}
fieldset{border:none;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:var(--fs-s);padding:0}
.pwrow{display:flex;gap:var(--sp2)}
.pwrow input{flex:1}
.err{color:var(--err);background:var(--err-bg);border-radius:var(--r-s);padding:10px 12px;margin:var(--sp2) 0;font-size:var(--fs-s);font-weight:600}
.okmsg{color:var(--ok);background:var(--ok-bg);border-radius:var(--r-s);padding:10px 12px;margin:var(--sp2) 0;font-size:var(--fs-s);font-weight:600}
.login-card form>button[type=submit]{width:100%;margin-top:var(--sp3)}
.login-alt{margin-top:var(--sp3);text-align:center}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:var(--card);border-top:4px solid var(--accent);box-shadow:0 1px 0 var(--line);padding-top:env(safe-area-inset-top)}
.hdr1{display:flex;align-items:center;gap:var(--sp2);padding:6px var(--sp2) 0 var(--sp2)}
.teamsw{border:none;background:none;padding:0 8px;gap:8px;max-width:58vw;justify-content:flex-start}
.teamsw .tdot{--tc:var(--accent)}
.teamsw .tn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.teamsw .tn b{font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.save{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.save.saving{background:#eef0f4;color:var(--muted)}
.save.offline{background:var(--warn-bg);color:var(--warn)}
.save.error{background:var(--err-bg);color:var(--err)}
.save .ic{width:16px;height:16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px var(--sp2) 0;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;display:inline-flex;align-items:center;min-height:var(--tap);padding:0 12px;font-size:var(--fs-s);font-weight:650;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:#f6f7f9}
.tabs a[aria-current=page]{color:var(--accent-ink);border-bottom-color:var(--accent-ink)}
.wnav{display:flex;align-items:center;gap:var(--sp1);padding:6px var(--sp2);border-top:1px solid var(--line2)}
.wnav h2{font-size:var(--fs);flex:1;text-align:center;font-weight:700}
.wnav .today-btn{padding:0 12px}

#main{padding:var(--sp3) var(--sp3) calc(96px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}
.view-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2);margin-bottom:var(--sp3)}
.view-head .grow{flex:1;min-width:160px}
.view-head h2{font-size:var(--fs-l)}
.summary{font-size:var(--fs-s);color:var(--muted);font-weight:600}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:var(--fs-s);margin-bottom:var(--sp3)}
.loaderr{background:var(--err-bg);color:var(--err);border-radius:var(--r);padding:16px;font-weight:600}


/* ---------- board ---------- */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:var(--sp3);align-items:start}
@media (min-width:768px){.cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:hidden;min-width:0}
.card.dragging{opacity:.5}
.card.drop-before{box-shadow:-4px 0 0 var(--accent-ink),var(--shadow)}
.card-head{background:var(--pastel,#eee);padding:var(--sp2) var(--sp2) var(--sp2) var(--sp3)}
.ch-row{display:flex;align-items:center;gap:var(--sp1)}
.ch-row .pname{font-weight:700;background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.12)}
.progress{display:flex;align-items:center;gap:var(--sp2);margin-top:var(--sp2);font-size:var(--fs-s);font-weight:700}
.bar{flex:1;height:8px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.tasks{list-style:none;margin:0;padding:0}
.task{border-top:1px solid var(--line2);padding:var(--sp1) var(--sp2) var(--sp2) 0;position:relative}
.task.drop-before{box-shadow:inset 0 3px 0 var(--accent-ink)}

.task.dragging{opacity:.45}
.trow{display:flex;align-items:flex-start;gap:2px}
.trow textarea{flex:1;min-width:0;font-weight:600;border-color:transparent;background:transparent;padding:10px 8px}

.trow textarea:focus{border-color:var(--accent-ink);background:#fff}
.task.done{background:var(--ok-bg)}
.task.done .trow textarea{text-decoration:line-through;color:#2f5d43}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:var(--tap);margin-top:2px}
.tnotes{margin:6px 0 0 var(--tap);width:calc(100% - var(--tap));font-size:var(--fs-s);min-height:36px;padding:7px 10px;border-color:transparent;background:rgba(0,0,0,.025);font-style:italic}
.tnotes:hover{border-color:var(--line)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:var(--fs-s);font-weight:600;color:var(--ink)}
.chip.on{background:var(--ok-bg);border-color:#9fd1b3}

.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:.02em}
.chip .tick{width:16px;height:16px;color:var(--ok)}
.addtask{display:flex;gap:var(--sp1);padding:var(--sp2);border-top:1px dashed var(--line)}
.addtask input{flex:1}
.drag{cursor:grab;color:#8b919c;display:none;align-items:center;justify-content:center;width:22px;min-height:var(--tap);flex:0 0 auto}
@media (hover:hover) and (pointer:fine){.drag{display:inline-flex}}
.empty{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--sp4);max-width:560px;margin:var(--sp3) auto;text-align:center}
.empty h2{margin-bottom:var(--sp2)}

.skel{background:linear-gradient(90deg,#eceef2 0%,#f6f7f9 50%,#eceef2 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:8px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-card{height:260px;border-radius:var(--r)}

/* ---------- by person ---------- */
.pv-top{display:flex;flex-wrap:wrap;gap:var(--sp2);align-items:flex-end;margin-bottom:var(--sp3)}
.pv-top .sel{flex:1;min-width:180px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp2);margin-top:var(--sp3)}
.who-grid button{justify-content:flex-start;min-height:56px;font-size:var(--fs)}
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:var(--sp3);overflow:hidden;border:1px solid var(--line2)}
.day>h3{padding:10px var(--sp3);background:#f7f8fa;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:var(--sp2)}
.day>h3 .muted{font-weight:500;font-size:var(--fs-s)}
.day.today{border-color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-ink),var(--shadow)}
.day.today>h3{background:var(--accent-soft);color:var(--accent-ink)}
.pv-list{list-style:none;margin:0;padding:0}
.pv-item{display:flex;align-items:flex-start;gap:var(--sp1);padding:var(--sp1) var(--sp3) var(--sp1) var(--sp1);border-top:1px solid var(--line2)}
.pv-item:first-child{border-top:none}
.pv-item.done{background:var(--ok-bg)}
.pv-item.done .pv-t{text-decoration:line-through;color:#2f5d43}
.pv-body{flex:1;min-width:0;padding:10px 0}
.pv-t{font-weight:600;word-break:break-word}
.pv-m{font-size:var(--fs-s);color:var(--muted);margin-top:2px;word-break:break-word}
.pv-body textarea{font-weight:600}

/* ---------- shifts ---------- */
.sgroup{margin-bottom:var(--sp4)}
.sgroup>h3{margin:0 0 var(--sp2);font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.shifts{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp2)}
.shift{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);border-left:6px solid #c9ced8;padding:var(--sp2);display:grid;grid-template-columns:var(--tap) 1fr var(--tap);gap:6px var(--sp2);align-items:start}
.shift.dept-grove{border-left-color:#3d7bc4;background:#f1f7fe}
.shift.dept-bloom{border-left-color:#c9a000;background:#fffbea}
.shift.dept-college{border-left-color:#d97a1c;background:#fff5ea}
.shift.dept-community{border-left-color:#6b4fbb}
.shift.done .s-prog,.shift.done .s-date,.shift.done .s-time{text-decoration:line-through;color:var(--muted)}
.s-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px var(--sp2);min-width:0}
.s-fields .wide{grid-column:1/-1}
.s-f label{display:block;font-size:var(--fs-s);font-weight:600;color:#3d4350;margin-bottom:2px}
.s-hint{font-size:var(--fs-s);color:var(--warn);margin-top:2px;font-weight:600}
.s-nice{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
.s-pa{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.s-pa select{width:auto;min-width:110px;font-size:var(--fs-s);min-height:36px;padding:4px 26px 4px 10px}
.s-head{display:none}
@media (min-width:1100px){
  .shift{grid-template-columns:var(--tap) 1fr var(--tap);padding:6px var(--sp2)}
  .s-fields{grid-template-columns:150px 150px minmax(200px,1.6fr) minmax(130px,.8fr) minmax(250px,1.4fr) 130px;align-items:start}
  .s-fields .wide{grid-column:auto}
  .s-f label{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .s-head{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);gap:var(--sp2);padding:0 var(--sp2) 6px 14px;font-size:var(--fs-s);font-weight:700;color:var(--muted)}
  .s-head .s-fields>span{padding-left:4px}
}

/* ---------- templates / links / notes / history / settings ---------- */
.notes-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--sp3);max-width:860px}
.notes-card textarea{min-height:320px}

.hist li:first-child{border-top:none}
.hist .hx{flex:1;min-width:0;word-break:break-word}
.hist .when{font-size:var(--fs-s);color:var(--muted);white-space:nowrap}
.hday{font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:var(--sp3) 0 var(--sp2);font-weight:700}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--sp3);margin-bottom:var(--sp3);max-width:720px;border:1px solid var(--line2)}
.panel h2{margin-bottom:var(--sp2);font-size:var(--fs-l)}
.prow{display:flex;align-items:center;gap:var(--sp2);padding:6px 0;border-top:1px solid var(--line2)}
.prow:first-of-type{border-top:none}
.prow input{flex:1}
.formrow{display:flex;gap:var(--sp2);margin-top:var(--sp2)}
.formrow input{flex:1}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:var(--fs-s);font-weight:600;margin:var(--sp2) 0}
.stack{display:grid;gap:var(--sp2)}

/* ---------- sheets, toasts ---------- */
dialog{border:none;padding:0;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 48px);color:var(--ink)}

dialog[open]{display:flex;flex-direction:column}

}
.sh-head{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) var(--sp2) var(--sp2) var(--sp3);border-bottom:1px solid var(--line2)}
.sh-head h2{flex:1;font-size:var(--fs);font-weight:700;word-break:break-word}
.sh-body{padding:var(--sp3);overflow:auto;display:grid;gap:var(--sp2);align-content:start}
.sh-foot{display:flex;gap:var(--sp2);justify-content:flex-end;padding:var(--sp2) var(--sp3) var(--sp3);flex-wrap:wrap}
.sh-foot button{min-width:96px}
.optlist{display:grid;gap:4px}
.opt{display:flex;align-items:center;gap:var(--sp2);min-height:var(--tap);padding:4px 8px;border-radius:var(--r-s);cursor:pointer;font-weight:600;border:1px solid transparent;width:100%;justify-content:flex-start;background:none;text-align:left}
.opt:hover{background:#f4f5f8}
.opt input{width:20px;height:20px;accent-color:var(--accent-ink);margin:0 4px}
.opt.dis{opacity:.55;cursor:default}
.opt.add{color:var(--accent-ink);border:1px dashed var(--line)}
.opt .sub{font-weight:500;color:var(--muted);font-size:var(--fs-s);margin-left:auto}
.optgroup-h{font-size:var(--fs-s);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:var(--sp2) 0 2px}
.menu-list{display:grid;gap:4px}
.menu-list button{justify-content:flex-start;border:none;background:none;font-size:var(--fs);font-weight:500;width:100%}
.menu-list button:hover{background:#f4f5f8}
.menu-list .sep{height:1px;background:var(--line2);margin:4px 0}
.hint{font-size:var(--fs-s);color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:var(--r-s);font-weight:600}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:grid;gap:var(--sp2);width:min(560px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;background:#1f2430;color:#fff;border-radius:var(--r);padding:6px 6px 6px 16px;display:flex;align-items:center;gap:var(--sp2);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:var(--fs-s);font-weight:600;min-height:52px}
.toast span{flex:1}
.toast.error{background:#8c1d13}
.toast button{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);min-height:40px}

@media (min-width:768px){

  .hdr1{padding:8px var(--sp3) 0}

  .wnav h2{flex:0 0 auto;min-width:220px}
  #main{padding:var(--sp4) var(--sp4) 96px}
}

  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .skel{animation:none}
}
@media print{
  .hdr .tabs,.hdr .wnav button,.save,#menuBtn,.teamsw .ic,.addtask,.drag,button.icon,.addp,.view-head,#toasts,.skip,.empty .acts,.btabs{display:none !important}
  body{background:#fff}
  .hdr{position:static;box-shadow:none;border-top:none}
  #main{padding:0}

  textarea,input,select{border:none !important;background:transparent !important;padding:2px 4px !important;min-height:0 !important}

   v2.1: simpler header, bottom tabs on phones, compact cards and rows
   ========================================================================== */

label.field.gap{margin-top:12px}

/* ---------- header: one row ---------- */
.hdr1{display:flex;align-items:center;gap:var(--sp2);padding:4px var(--sp2);min-height:52px}

.btabs .bt[aria-current=page],.btabs .bt.on{color:var(--accent-ink)}

.pmeta{display:flex;width:100%;justify-content:flex-start;text-align:left;background:none;border:none;padding:0 6px;min-height:32px;font-size:var(--fs-s);font-weight:600;color:#2f3542;

.addp{position:relative;width:32px;min-width:32px;min-height:32px;padding:0;border:none;background:none;color:var(--accent-ink);border-radius:50%}

.tchip:has(input:focus-visible){outline:3px solid var(--accent-ink);outline-offset:2px}
.tchip .av{width:24px;height:24px;font-size:11px}
.sh-body input[type=date]{width:auto;min-width:180px}

/* ---------- by person ---------- */
.pv-top select{max-width:420px}
.who-grid .sub{margin-left:auto}
.pv-body{padding:0}
.pv-body textarea{font-weight:500;border-color:transparent;background:transparent;padding:10px 6px}
.pv-body textarea:focus{border-color:var(--accent-ink);background:#fff}
.pv-item.done .pv-body textarea{text-decoration:line-through;color:#52705e}
.pv-item.done{background:#eef7f1}
.pv-m{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 6px 8px;margin:0}
.pv-body .tnotes{margin:0 0 8px;width:100%}
.pv-add{margin-top:var(--sp2);background:var(--card);border-radius:var(--r);border:1px solid var(--line2)}
.day>h3{padding:8px var(--sp3)}

/* ---------- PA shifts: cards on phones, the old table on desktop ---------- */
.shift.done .s-prog{text-decoration:line-through;color:var(--muted)}
.s-lab{display:block;font-size:var(--fs-s);font-weight:600;color:#3d4350;margin-bottom:2px}
.s-pa .addp{margin-left:2px}
.s-pa .chip{min-height:30px}
.s-fields .f-prog{grid-column:1/-1}
.s-fields .f-pa{grid-column:1/-1}
@media (max-width:1099px){
  .shift{grid-template-columns:var(--tap) minmax(0,1fr) var(--tap)}
  .s-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .s-fields input,.s-fields select{width:100%}
  .s-fields .f-prog{order:-1}
  .s-fields .f-loc,.s-fields .f-dept{grid-column:1/-1}
  .s-fields .f-dept select{max-width:220px}
  .s-prog{font-weight:700}
}
@media (min-width:1100px){
  .s-fields .f-prog,.s-fields .f-pa{grid-column:auto}
  .s-lab{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .shift{border-radius:0;box-shadow:none;border-top:none;border-right:none;border-bottom:1px solid var(--line2);padding:4px var(--sp2)}
  .shifts{gap:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line2)}
  .s-fields input[type=text],.s-fields input[type=date],.s-fields select{border-color:transparent;background:transparent}
  .s-fields input:hover,.s-fields select:hover{border-color:var(--line)}
  .s-fields input:focus,.s-fields select:focus{border-color:var(--accent-ink);background:#fff}
}
.sgroup>h3{text-transform:none;letter-spacing:0}

/* ---------- Master (plain grouped list; search on top) ---------- */
.tgroup{margin-bottom:var(--sp4)}
.tgroup>h3{margin:0 0 var(--sp2);font-size:var(--fs-s);color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:hidden}
.tplrow{border-top:1px solid var(--line2)}
.tplrow:first-child{border-top:none}
.tplrow summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3) 0 var(--sp2);font-weight:650}
.tplrow summary::-webkit-details-marker{display:none}
.tplrow summary .ic{transition:transform .15s;color:var(--muted)}
.tplrow details[open]>summary .ic{transform:rotate(90deg)}
.tplrow summary .grow{flex:1;min-width:0;word-break:break-word}
.tplrow summary .sub{font-weight:500;color:var(--muted);font-size:var(--fs-s)}
.tplrow .card.tpl{margin:0 var(--sp2) var(--sp2);box-shadow:none}
.cb-sp{width:var(--tap);flex:0 0 auto}
.tpl-task .tmeta{padding-left:var(--tap)}

/* ---------- Links (plain list) ---------- */
.links{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);max-width:760px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:var(--sp2);border-top:1px solid var(--line2);padding:2px 4px 2px var(--sp3)}
.lrow:first-child{border-top:none}
.lname{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:52px;text-decoration:none;padding:4px 0}
a.lname .lt{text-decoration:underline;font-weight:650;word-break:break-word}
.lname .host{font-size:var(--fs-s);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Notes ---------- */
.notes-h{font-size:var(--fs);margin-bottom:var(--sp2)}

/* phones + touch: every control at least 44px, form text at least 16px (no iOS zoom) */
@media (max-width:767px), (pointer:coarse){
  .chip,.tnotes,.toast button,button.link,.pmeta,.save .save-btn,.wnav .today-btn{min-height:44px}
  .chip.day{min-height:44px;min-width:44px;justify-content:center}
  .addp{width:44px;min-width:44px;min-height:44px}
  .addp::before{inset:8px}
  .addp::after{inset:0}
  .s-pa .chip{min-height:44px}
  .tnotes{font-size:16px}
  .tmeta{gap:6px}
  .tmeta:has(> .addp:only-child){margin-top:-8px}
}
@media print{
  .btabs,#wnav button,.pmeta.empty{display:none !important}
  .card.is-today{box-shadow:none}
}

/* desktop: a row's ⋯ is faint until you point at or tab into the row (it stays a full 40 px target) */
@media (hover:hover) and (pointer:fine){
  .task .trow>button.icon,.pv-item>button.icon{opacity:.4}
  .task:hover .trow>button.icon,.task:focus-within .trow>button.icon,.pv-item:hover>button.icon,.pv-item:focus-within>button.icon{opacity:1}
}

/* big weeks: cards off screen skip layout and paint until scrolled near (B15) */
#v-board li.card{content-visibility:auto;contain-intrinsic-size:auto 420px}
@media print{ #v-board li.card{content-visibility:visible} }

/* the Board keeps its layout while another tab is showing, so coming back to a big week is instant (B15).
   content-visibility:hidden hides it from screen readers, keyboard and find, like display:none. */
#main>section#v-board[hidden]{display:block !important;content-visibility:hidden;contain-intrinsic-size:0 0;height:0;overflow:hidden;margin:0;padding:0}
@media print{ #main>section#v-board[hidden]{display:none !important} }

/* ==========================================================================
   v2.2: Roots brand (Roots Brand & Website Design System v3) + Calendar
   ========================================================================== */
:root{
  --roots-green:#202f0e; --roots-herb:#2e4a0d; --roots-cream:#f5f1e8; --roots-tea:#b0c597; --roots-sage:#88a596;
  --ink:#202020; --muted:#5c5c5c; --line:rgba(32,47,14,.18); --line2:rgba(32,47,14,.10); --bg:#f5f1e8; --card:#fff;
  --accent:#2e4a0d; --accent-ink:#2e4a0d; --accent-soft:#eaf0e1; --heading:#202f0e;
  --ok:#1f5a2c; --ok-bg:#e7f1df;
  --d-community:#2e4a0d; --d-grove:#293d93; --d-bloom:#e59e2c; --d-college:#c24a48; --d-other:#88a596;
  --t-community:#eef3e6; --t-grove:#eceffa; --t-bloom:#fdf3e2; --t-college:#fbeceb; --t-other:#f1f3f0;
  --font: Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(32,47,14,.06),0 2px 8px rgba(32,47,14,.05);
}
body{background:var(--bg)}
h1,h2,h3,h4{color:var(--heading)}
:focus-visible{outline-color:var(--roots-herb)}
html[data-kb] :focus:not(input[type=checkbox]):not(.sr-only){outline:3px solid var(--roots-herb);outline-offset:2px}
html[data-kb] .hdr :focus{outline-color:var(--roots-tea)}
.hdr{border-top:none;background:var(--roots-green);box-shadow:none}
.hdr .teamsw,.hdr .teamsw .tn b{color:var(--roots-cream)}
.hdr .teamsw .muted,.hdr .teamsw .tn span{color:var(--roots-tea)}
.hdr .teamsw .tdot{--tc:var(--roots-tea)}
.hdr .teamsw:hover{background:rgba(255,255,255,.08)}
.hdr #menuBtn{color:var(--roots-cream)}
.hdr #menuBtn:hover{background:rgba(255,255,255,.1);color:#fff}
.hdr :focus-visible{outline-color:var(--roots-tea)}
.hdr .tabs a{color:#d9e2cc}
.hdr .tabs a:hover{color:#fff;background:rgba(255,255,255,.08)}
.hdr .tabs a[aria-current=page]{color:#fff;border-bottom-color:var(--roots-tea)}
.hdr .save{background:rgba(255,255,255,.1);color:var(--roots-cream)}
.hdr .save.offline{background:var(--warn-bg);color:var(--warn)}
.hdr .save.error{background:var(--err-bg);color:var(--err)}
.hdr .wnav{background:var(--roots-cream);border-top:none;border-bottom:1px solid var(--line)}
.hdr .wnav h2{color:var(--heading)}
.hdr .wnav button.icon{color:var(--heading)}
.hdr .wnav .today-btn{background:transparent;border-color:var(--heading);color:var(--heading);border-radius:999px}
button.primary,.btn.primary{background:var(--roots-herb);border-color:var(--roots-herb);color:var(--roots-cream)}
button{border-radius:999px;border-color:rgba(32,47,14,.28)}
button.icon{border-radius:50%}
.menu-list button,.opt,.who-grid button,.tabs a,.btabs .bt{border-radius:var(--r-s)}
.card,.day,.panel,.empty,.shift,.hist{border-color:var(--line2)}
.caption{color:var(--muted);font-size:var(--fs-s);margin:0 0 var(--sp3)}
.chip.on{background:var(--ok-bg);border-color:#a9c79a}
.task.done,.pv-item.done{background:#f1f6ec}
.mk.watch{color:#3b4a2a;font-weight:600}
.mk.watch .wv{font-weight:500}
.mk.gonemk{color:var(--err)}
.btabs{background:#fff}
.btabs .bt[aria-current=page],.btabs .bt.on{color:var(--roots-herb)}

/* department pill + colour bar (Roots calendar colours; dark ink on Bloom yellow) */
.dpill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:var(--fs-s);font-weight:650;white-space:nowrap;color:#fff;background:var(--dc,var(--d-other))}
.dpill.dept-bloom{color:#2b2208}
.dpill.dept-other{color:#1d2a18}
.dept-community{--dc:var(--d-community);--dt:var(--t-community)}
.dept-grove{--dc:var(--d-grove);--dt:var(--t-grove)}
.dept-bloom{--dc:var(--d-bloom);--dt:var(--t-bloom)}
.dept-college{--dc:var(--d-college);--dt:var(--t-college)}
.dept-other{--dc:var(--d-other);--dt:var(--t-other)}

/* ---------- Roots site pill groups (cal__chips / cal__chip): white, rounded, dark green when on ---------- */
.cal__chips{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;max-width:100%;box-sizing:border-box;padding:4px;border:1px solid var(--line);border-radius:24px;background:#fff}
.cal__chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:500 15px/1 var(--font);cursor:pointer;white-space:nowrap}
.cal__chip:hover{background:var(--roots-cream)}
.cal__chip[aria-pressed=true]{background:var(--roots-herb);color:#fff}
.cal__chip[aria-pressed=true]:hover{background:var(--roots-herb)}
.cal__chip[aria-pressed=true] .cal__dot{border-color:#fff}
.cal__dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--dc,var(--d-other));border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;background:#fff;flex:none}
.seg button{border:none;border-radius:999px;min-height:36px;padding:0 16px;font-size:15px;font-weight:500;background:transparent;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--roots-herb);color:#fff}
.pill-sel{width:auto;min-width:150px;border-radius:999px;border-color:var(--line);color:var(--heading);font-weight:550;min-height:40px;padding:6px 34px 6px 16px;background-color:#fff}
.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:14px}
.cal-line{font-size:15px;font-weight:600;color:var(--heading);margin:0 0 10px}
#v-cal .caption{margin-bottom:10px}

/* ---------- the week strip (site's rhythm__days / rhythm__day) ---------- */
.rstrip{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(7,minmax(0,1fr))}
.rday{min-width:0;display:flex;flex-direction:column;gap:12px;min-height:13rem;padding:16px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;scroll-margin-top:150px}
.rday.is-today{border:2px solid var(--heading);padding:15px 13px}
.rd-name{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:0;color:var(--heading);font:600 16px/1.3 var(--font)}
.rd-pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:0;padding:0;border:0;border-radius:6px;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rd-pick:hover{background:none}
.rd-pick:hover .rd-day{text-decoration:underline;text-underline-offset:4px}
.rd-day{font-weight:650}
.rd-date{font-size:13px;font-weight:500;color:#5e5e5e}
.rd-pick[aria-pressed=true] .rd-date{color:var(--roots-herb);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.rd-today{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--roots-herb);color:#fff;font:600 13px/1.4 var(--font)}
.rd-today.sm{font-size:11px;padding:0 6px;line-height:1.5}
.rquiet{margin:0;color:#5e5e5e;font:400 14px/1.5 var(--font)}
.rtiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
/* a program (site's rhythm__tile): beige, time, name, dot pill */
.rtile{width:100%;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;padding:12px 12px 11px;border:0;border-radius:12px;background:var(--roots-cream);color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:background-color .15s ease}
.rtile:hover{background:#ece5d5}
.rt-time{font:400 14px/1.35 var(--font);color:#5e5e5e;font-variant-numeric:tabular-nums}
.rt-name{font:600 16px/1.3 var(--font);color:var(--heading);overflow-wrap:break-word;hyphens:manual}
.rtile:hover .rt-name{text-decoration:underline;text-underline-offset:4px}
.cal__tag{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;max-width:100%;box-sizing:border-box;margin-top:4px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:500 14px/1.3 var(--font)}
.cal__tag .tag-t{min-width:0;overflow-wrap:break-word}
.cal__tag .cal__dot{align-self:flex-start;margin-top:4px}
.rtile.compact .cal__tag .tag-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtile.compact .cal__tag .cal__dot{margin-top:0;align-self:center}
.cal__tag.need{background:#fff1dc;border-color:#e2a54a;color:#7a3a00;font-weight:650}
.cal__tag.none{color:#5e5e5e}
.rt-tasks{font-size:13px;color:#5e5e5e}
.rtile.gone{background:#f1eee8}
.rtile.gone .rt-name{text-decoration:line-through}
/* compact tiles (month) */
.rtile.compact{gap:2px;padding:6px 7px;border-radius:8px}
.rtile.compact .rt-time{font-size:12px;line-height:1.3}
.rtile.compact .rt-name{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rtile.compact .cal__tag{margin-top:2px;padding:1px 7px;gap:5px;font-size:12px}
.rtile.compact .cal__dot{width:8px;height:8px}
/* office hours + a person's tasks under the day's tiles (checkbox lines) */
.rday .oh{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ohl{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:12px;line-height:1.3;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:#33402a}
.ohl.setup{border-style:dashed}
.rtasks{list-style:none;margin:0;padding:8px 0 0;display:grid;gap:4px;border-top:1px dashed var(--line)}
.rtasks.wide{border-top:none;padding:6px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;max-width:760px}
.rtask{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:0 2px;font-size:14px;line-height:1.35}
.rt-cb{display:flex;align-items:flex-start;gap:8px;min-height:32px;padding-top:6px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.rt-cb input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--roots-herb);cursor:pointer}
.rtask.done .rt-tx{text-decoration:line-through;color:#5e5e5e}
.rt-more{width:32px !important;min-width:32px !important;height:32px;min-height:32px !important}
.rt-meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:0 0 4px 26px;font-size:12px;color:#5e5e5e}
.rt-meta .mk{font-size:12px}

/* ---------- hours (admins only) ---------- */
.hrs-line{margin:0 0 12px;padding:10px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.hrs-main{margin:0;font-size:15px;font-weight:500;color:var(--ink)}
.hrs-main b{color:var(--heading)}
.hrs-faint{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:2px 0 0;font-size:13px;color:#646464}
.hrs-reset{min-height:28px;padding:0 4px;font-size:13px}
.whodo{margin-top:18px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;max-width:980px}
.whodo-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
.whodo-head h3{margin:0;font-size:18px}
.whodo-list{list-style:none;margin:0;padding:0}
.whodo-list li+li{border-top:1px solid var(--line2)}
.whodo-row{min-height:52px}
.whodo-row{width:100%;display:grid;grid-template-columns:28px minmax(110px,150px) minmax(220px,300px) minmax(120px,160px) minmax(80px,1fr);align-items:center;justify-content:stretch;gap:12px;min-height:48px;padding:6px 8px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;font:inherit;font-size:15px;font-weight:500}
.whodo-row:hover{background:var(--roots-cream)}
.wd-name{font-weight:650;color:var(--heading)}
.wd-prog b{color:var(--heading)}
.wd-off{color:#4a4a4a}
.wd-depts{display:flex;align-items:center;gap:6px}
.wd-dep .cal__dot{width:12px;height:12px}

/* ---------- month: the same strip stacked, one row per week ---------- */
.mgrid{display:grid;gap:10px}
.mhead{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));gap:8px;margin-bottom:-2px}
.mhead span{padding:0 8px;font-size:13px;font-weight:650;color:var(--heading)}
.mweek{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px}
.mdays{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wklabel{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:0;min-height:0;padding:10px 2px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--heading);font-size:12px;font-weight:600;line-height:1.2}
.wklabel b{font-size:17px;font-weight:700}
.wklabel:hover{background:var(--roots-cream)}
.mday{min-width:0;min-height:112px;display:flex;flex-direction:column;gap:5px;padding:6px;border:1px solid var(--line);border-radius:14px;background:#fff}
.mday.out{background:rgba(255,255,255,.45);border-style:dashed}
.mday.out .dn{color:#6a6a6a}
.mday.today{border:2px solid var(--heading);padding:5px}
.dnum{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:28px;min-width:28px;padding:0 6px;border:none;border-radius:999px;background:transparent;font-size:13px;font-weight:650;color:var(--heading)}
button.dnum:hover{background:var(--roots-cream)}
.mday.is-sel .dn{text-decoration:underline;text-underline-offset:3px}
.mtiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.mtiles>li,.rtiles>li{min-width:0}
.mtiles .more{width:100%;min-height:24px;border:none;border-radius:6px;background:transparent;font-size:12px;font-weight:650;color:var(--heading);justify-content:flex-start;padding:0 6px}
.mtiles .more:hover{background:var(--roots-cream)}
.dots{display:none}
.agenda{display:none}

/* ---------- below the strip ---------- */
.wother{margin-top:var(--sp5)}
.wo-head{display:flex;align-items:center;gap:var(--sp2);border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:var(--sp3)}
.wo-head h3{flex:1;font-size:17px}
.wother>h3{font-size:17px;padding-bottom:6px;margin-bottom:var(--sp2)}
.wother .pv-list{background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.card.personal .card-head{background:#f3efe4}
.pname-static{font-size:var(--fs);padding:8px 0}
#v-person .pv-days{margin-bottom:var(--sp3)}
.chip.su{padding-right:2px}
.chip-x{width:32px !important;min-width:32px !important;min-height:32px;height:32px}
.su-sel{border-radius:999px !important;border-color:var(--roots-herb) !important;color:var(--roots-herb);font-weight:600}
.need-step{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 2px}
.need-step button.icon{width:32px;min-width:32px;min-height:32px;height:32px}
.need-step .nv{min-width:16px;text-align:center;font-weight:700;font-size:var(--fs-s)}
.need-step .nl{font-size:12.5px;font-weight:600;color:#4f4f4f;padding:0 4px 0 10px}
.tplbtn{margin:6px 8px 10px 14px;min-height:36px;font-size:var(--fs-s);font-weight:600;border:1px solid rgba(46,74,13,.35);background:#fff;color:var(--roots-herb);gap:6px}
.tplbtn:hover{background:var(--accent-soft)}
/* narrow screens (site's narrow layout): one card per day, name on the left, programs on the right */
@media (max-width:1099px){
  .rstrip{grid-template-columns:1fr;gap:10px}
  .rday{display:grid;grid-template-columns:7rem minmax(0,1fr);align-items:start;gap:10px 12px;min-height:0;padding:14px}
  .rday.is-today{padding:13px}
  .rday>*{grid-column:2}
  .rday>.rd-name{grid-column:1;grid-row:1 / span 4}
  .rtiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

/* ---------- event sheet ---------- */
dialog.evsheet{width:min(640px,calc(100vw - 24px))}
.ev-sheet{display:grid;gap:var(--sp3);border-left:6px solid var(--dc);padding-left:var(--sp3);margin-left:calc(-1 * var(--sp3))}
.ev-sheet .ev-src{margin:0}
.ev-facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.ev-facts dt{font-weight:650;color:var(--heading)}
.ev-facts dd{margin:0}
.ev-sec h3{font-size:15px;margin-bottom:var(--sp2)}
.ev-sec .tasks{border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:var(--sp2)}
.ev-sec .tasks .task:first-child{border-top:none}
.ev-sec .addtask{border:1px dashed var(--line);border-radius:10px;padding:6px}
.ev-sec .tplbtn{margin:var(--sp2) 0 0}
.ev-sheet.gone .ev-facts dd{text-decoration:line-through}

/* ---------- PA shifts: calendar rows are text ---------- */
.shift.cal{grid-template-columns:6px 1fr 6px;padding-left:0;border-left-width:6px}
.shift{border-left-color:var(--dc,#c9ced8);background:#fff}
.shift.dept-grove,.shift.dept-bloom,.shift.dept-college,.shift.dept-community{background:#fff;border-left-color:var(--dc)}
.shift.cal .s-val{display:block;font-size:15px;padding:6px 0;word-break:break-word}
.shift.cal .s-prog{font-weight:650}
.shift.gone .s-prog{text-decoration:line-through}
.shift.gone{border-style:dashed}
.shift.past{background:#f7f5f0 !important}   /* past rows: a quieter background, not see-through (see-through text failed contrast) */
.s-lab{display:block;font-size:var(--fs-s);font-weight:600;color:#3d4350;margin-bottom:2px}
.shifts-head{align-items:center}
.shifts-head .caption{margin:0}
.wk-jump{border:none;background:none;padding:0 6px;min-height:36px;gap:8px;font:inherit;font-size:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--heading);border-radius:6px}
.wk-jump:hover{background:var(--accent-soft)}
@media (min-width:1100px){
  .s-lab{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
}

/* ---------- My tasks ---------- */
.pv-top label{font-size:var(--fs-s);font-weight:650;color:var(--heading);align-self:center}
.pv-top{align-items:center}
.pv-h{display:flex;align-items:baseline;gap:10px;font-size:18px;margin:var(--sp4) 0 var(--sp2)}
.pv-h .muted{font-size:var(--fs-s);font-weight:500}
#v-person>.pv-h:first-of-type{margin-top:0}
.ntw-list{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp2)}
.ntw{background:#fff;border:1px solid var(--line2);border-left:6px solid var(--dc);border-radius:12px;overflow:hidden}
.ntw-head{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:4px 10px;text-align:left;border:none;border-radius:0;background:var(--dt);padding:8px 12px;font-size:15px;font-weight:500;color:var(--ink);min-height:48px}
.ntw-head:hover{background:var(--dt);filter:brightness(.98)}
.ntw-head b{color:var(--heading)}
.ntw-d{font-weight:700;color:var(--heading)}
.ntw-t{color:#3d4536}
.ntw>p{margin:0;padding:8px 14px}
.ntw-tasks{list-style:none;margin:0;padding:6px 14px 10px;display:grid;gap:4px;font-size:15px}
.ntw-tasks li{display:flex;align-items:center;gap:8px}
.ntw-tasks .tick{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ok)}
.ntw-tasks li.done{color:var(--muted);text-decoration:line-through}
.watch-list{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.watch-list li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-top:1px solid var(--line2);min-height:48px}
.watch-list li:first-child{border-top:none}
.watch-list li.done .grow{text-decoration:line-through;color:var(--muted)}
.watch-list .grow{flex:1;min-width:0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- v2.2 addendum: waiting, repeats weekly, program flow, staff divider ---------- */
.mk.waiting{display:inline-flex;align-items:center;gap:4px;background:#fdf0d5;color:#7a4300;border:1px solid #f0c77a;border-radius:999px;padding:0 8px;font-weight:650}
.mk.rec{color:#3b4a2a;font-weight:600}
a.flow{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;color:var(--roots-herb);text-decoration:underline;text-underline-offset:2px;min-height:24px;white-space:nowrap}
a.flow:hover{color:var(--roots-green)}
a.flow .ic{width:14px;height:14px}
.flowrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.flowrow .pmeta{flex:1 1 auto}
.optgroup-h{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 4px 4px}

.ev-sheet .need-step{margin-left:4px}



/* ---------- v2.2 P1: estimates (admins only), PAs tab + profile, Links folders, Templates flow ---------- */
.est{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:#5b6152;padding:0 2px;white-space:nowrap}
.est.set{color:#3b4a2a}
.est-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 var(--sp2);padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line2);font-size:var(--fs-s);color:#3d4433}
.est-line .ic{color:var(--roots-herb)}
.est-line .est-note{color:#5b6152}
.mk.overbook{display:inline-flex;align-items:center;gap:4px;background:#fdf0d5;color:#7a4300;border:1px solid #f0c77a;border-radius:999px;padding:0 8px;font-weight:650;font-size:12.5px;white-space:nowrap}
.pas-head{margin:0 0 var(--sp3)}
.pas-title{margin:0 0 4px;font-size:22px;color:var(--roots-green)}
.pas-title .muted{font-weight:500;font-size:16px}
.pas-wrap{background:#fff;border:1px solid var(--line2);border-radius:14px;overflow:hidden;max-width:1000px}
.pas-table{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.pas-table th,.pas-table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
.pas-table thead th{font-size:12.5px;font-weight:700;color:#4b5340;background:#faf8f3;text-transform:none}
.pas-table tbody tr:last-child>*{border-bottom:none}
.pas-table .num{text-align:right;white-space:nowrap}
.pas-table td.est-cell{display:table-cell}
.pas-table td.est-cell .mk.overbook{margin-left:8px}
.pas-table tr.ob{background:#fffaf0}
.pa-open{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:none;background:none;padding:0;font-weight:650;color:var(--roots-green);cursor:pointer;text-align:left}
.pa-open:hover span{text-decoration:underline}
.pa-open .ic{color:var(--muted)}
.pas-note{margin-top:var(--sp2)}
#sheet.wide{max-width:720px}
.pa-prof .ev-sec{margin-bottom:var(--sp3)}
.pm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:6px 0 10px}
.pm-h{font-size:11.5px;font-weight:700;color:#5b6152;text-align:center}
.pm-day{min-height:40px;border-radius:8px;background:#faf8f3;display:flex;flex-direction:column;align-items:center;padding:4px 2px;gap:3px}
.pm-day.out{opacity:.45}
.pm-day.today{outline:2px solid var(--roots-herb)}
.pm-n{font-size:12px;font-weight:600;color:#3d4433}
.pm-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.pm-dots i{width:8px;height:8px;border-radius:50%;background:var(--dc,#88a596)}
.pm-dots i.dept-community{background:#2e4a0d}.pm-dots i.dept-grove{background:#293d93}.pm-dots i.dept-bloom{background:#e59e2c}.pm-dots i.dept-college{background:#c24a48}
.pm-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pm-list li{border-left:4px solid #88a596;padding-left:8px}
.pm-list li.dept-community{border-left-color:#2e4a0d}.pm-list li.dept-grove{border-left-color:#293d93}.pm-list li.dept-bloom{border-left-color:#e59e2c}.pm-list li.dept-college{border-left-color:#c24a48}
.pm-list button.link{display:grid;grid-template-columns:96px 118px 1fr;gap:2px 10px;align-items:baseline;width:100%;min-height:36px;text-align:left;color:inherit;text-decoration:none;padding:4px 0;font-weight:400}
.pm-list b{font-weight:650;color:var(--roots-green)}
.pm-list button.link:hover b{text-decoration:underline}
.pm-d{color:#3d4433}.pm-t{color:#5b6152}
.pp-hours{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.pp-hours th,.pp-hours td{padding:6px 4px;border-bottom:1px solid var(--line2);text-align:left;font-weight:500}
.pp-hours .num{text-align:right}
.pp-hours tr.cur th{font-weight:700}
.pp-oh{list-style:none;margin:0 0 8px;padding:0;font-size:var(--fs-s);display:grid;gap:4px}
.pp-addrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 10px}
.pp-notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pp-notes li{background:#faf8f3;border-radius:10px;padding:8px 12px}
.pp-body{margin:0 0 2px;white-space:pre-wrap}
.pp-arch{margin-left:10px;font-size:12.5px}
#ppNote{width:100%}
.lfolders{display:grid;gap:var(--sp2);max-width:860px}
.lfolder{background:#fff;border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.lfolder>summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;cursor:pointer;list-style:none}
.lfolder>summary::-webkit-details-marker{display:none}
.lfolder>summary h3{margin:0;font-size:16px;color:var(--roots-green);flex:1}
.lfolder>summary .sub{font-size:12.5px;color:#5b6152}
.lfolder>summary .ic{transition:transform .15s}
.lfolder[open]>summary .ic{transform:rotate(90deg)}
.lfolder>ul.links{margin:0;border-top:1px solid var(--line2)}
.lfolder .lf-empty{margin:0;padding:10px 16px;border-top:1px solid var(--line2)}
li.tplrow.hasflow{position:relative}
li.tplrow.hasflow>details>summary .sub{margin-right:118px}
a.tplflow{position:absolute;top:0;right:14px;height:48px;display:flex;align-items:center}
@media (max-width:767px){
  .pas-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .pas-table,.pas-table tbody,.pas-table tr,.pas-table th,.pas-table td{display:block;width:auto}
  .pas-table tr{padding:8px 14px;border-bottom:1px solid var(--line2)}
  .pas-table tbody tr>*{border-bottom:none;padding:2px 0}
  .pas-table td.num{text-align:left;display:flex;justify-content:space-between;gap:8px}
  .pas-table td.num::before{content:attr(data-l);color:#5b6152;font-weight:600}
  .pas-table td.est-cell{display:flex;flex-wrap:wrap}
  li.tplrow.hasflow>details>summary .sub{margin-right:0}
  li.tplrow.hasflow>details>summary{padding-bottom:22px}
  a.tplflow{top:auto;bottom:4px;left:44px;right:auto;height:24px}
  .pm-list button.link{grid-template-columns:84px 1fr}
  .pm-list b{grid-column:1 / -1}
}

/* ---------- phone ---------- */
@media (max-width:767px){
  .cal-bar{gap:8px;flex-wrap:wrap}
  .cal-bar .cal__chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .cal-bar .cal__chips::-webkit-scrollbar{display:none}
  /* the person and department pills scroll sideways; the fade on the right says there is more */
  .cal-bar .cal-who,.cal-bar .cal-dept{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);padding-right:30px}
  .cal-bar .cal-who,.cal-bar .cal-dept{flex:1 1 100%}
  #v-cal .caption{display:none}
  .mhead{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .mhead>span:first-child{display:none}
  .mhead span{padding:0;text-align:center}
  .mweek{grid-template-columns:minmax(0,1fr)}
  .mgrid{gap:3px}
  .wklabel{display:none}
  .mdays{gap:3px}
  .mday{min-height:58px;padding:2px;align-items:center;border-radius:10px}
  .mday.today{padding:1px}
  .mtiles{display:none}
  .dnum .rd-today{display:none}
  .mday.today .dn{background:var(--roots-herb);color:#fff;border-radius:999px;padding:1px 6px}
  .dots{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:3px;max-width:100%;overflow:hidden}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
  .dots b{font-size:10px;line-height:7px;color:var(--heading)}
  .dnum{align-self:center;min-height:44px;min-width:44px;justify-content:center;padding:0}
  .ag-earlier{display:flex;align-items:center;gap:6px;min-height:44px;margin:0 0 var(--sp2);font-weight:600;color:var(--roots-herb)}
  .agenda{display:block;margin-top:var(--sp4)}
  .ag-day{margin-bottom:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;scroll-margin-top:150px}
  .ag-day.today{border:2px solid var(--heading);padding:13px}
  .ag-day>h3{display:flex;align-items:center;gap:8px;font-size:16px;margin:0 0 10px}
  .rtiles{grid-template-columns:minmax(0,1fr)}
  .rday{grid-template-columns:6.25rem minmax(0,1fr);gap:8px 10px;padding:12px}
  .rday.is-today{padding:11px}
  .rd-name{font-size:15px}
  .whodo-row{grid-template-columns:28px minmax(0,1fr);gap:2px 10px}
  .whodo-row>.av{grid-row:1 / span 4}
  .whodo-row>span:not(.av){grid-column:2}
  .chip-x,.ev-sheet .chip-x{width:44px !important;min-width:44px !important;height:44px;min-height:44px}
  .need-step button.icon{width:44px;min-width:44px;height:44px;min-height:44px}
  .su-sel,.pill-sel,.seg button,.cal__chip,.tplbtn,.rd-pick{min-height:44px}
  .rt-more{width:44px !important;min-width:44px !important;height:44px;min-height:44px !important}
  .rt-cb{min-height:44px;padding-top:12px}
  .wk-jump,a.flow,.hrs-reset{min-height:44px}
  .s-pa select,.su-sel{min-height:44px;font-size:16px}   /* 16px stops iPhone zooming in on the sign-up list */
  .ev-sheet{margin-left:calc(-1 * var(--sp3));padding-left:calc(var(--sp3) - 6px)}
}
@media (pointer:coarse){
  .chip-x{width:44px !important;min-width:44px !important;height:44px;min-height:44px}
  .need-step button.icon{width:44px;min-width:44px;height:44px;min-height:44px}
  .su-sel,.pill-sel,.seg button,.cal__chip,.tplbtn,.wklabel,.dnum,.rt-cb,.wk-jump,a.flow,.hrs-reset,.s-pa select{min-height:44px}
  .rt-more{width:44px !important;min-width:44px !important;height:44px;min-height:44px !important}
}
@media print{
  .cal-bar,.caption,.agenda,.whodo{display:none !important}
  .rtile{border:1px solid #999}
  .cal__dot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>

<a class="skip" href="#main">Skip to content</a>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<main id="login" hidden aria-labelledby="loginTitle">
  <div class="login-card">
    <h1 id="loginTitle">Roots DFW <span>Task sheet</span></h1>

    <form id="teamForm" novalidate>
      <fieldset>
        <legend>Your team</legend>
        <div class="team-pick" id="teamPick"></div>
      </fieldset>
      <input type="text" id="teamUser" name="username" autocomplete="username" hidden tabindex="-1" aria-hidden="true">
      <label class="field" for="teamPw">Team password</label>
      <div class="pwrow">
        <input type="password" id="teamPw" name="password" autocomplete="current-password" required>
        <button type="button" class="pwtoggle" aria-controls="teamPw" aria-pressed="false">Show</button>
      </div>
      <p id="teamErr" class="err" role="alert" hidden></p>
      <button type="submit" class="primary" id="teamSubmit">Sign in</button>
    </form>

    <form id="adminForm" novalidate hidden>
      <h2 class="form-h">Admin sign in</h2>
      <label class="field" for="adminEmail">Email</label>

      <label class="field gap" for="adminPw">Password</label>
      <div class="pwrow">
        <input type="password" id="adminPw" name="password" autocomplete="current-password" required>
        <button type="button" class="pwtoggle" aria-controls="adminPw" aria-pressed="false">Show</button>
      </div>
      <p id="adminErr" class="err" role="alert" hidden></p>
      <button type="submit" class="primary" id="adminSubmit">Sign in</button>

    <div class="login-alt">
      <button type="button" class="link" id="adminToggle">Admin sign in</button>
    </div>
  </div>
</main>

<div id="shell" hidden>
  <header class="hdr" id="hdr">
    <h1 class="sr-only" id="appTitle">Roots PA Tasks</h1>
    <div class="hdr1">
      <div id="teamSlot" class="teamslot"></div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <span id="saveState" class="save" role="status" aria-live="polite"></span>
      <button type="button" class="icon" id="menuBtn" aria-haspopup="dialog" aria-label="Menu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="wnav" id="wnav">
      <button type="button" class="icon" id="navPrev" aria-label="Previous week"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2 id="navLabel" aria-live="polite">Week</h2>
      <button type="button" class="icon" id="navNext" aria-label="Next week"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="today-btn" id="navToday">This week</button>

  </header>
  <main id="main" tabindex="-1">
    <section id="v-cal" data-view="cal" aria-label="Calendar" hidden></section>
    <section id="v-board" data-view="board" aria-label="Weekly board" hidden></section>
    <section id="v-person" data-view="person" aria-label="My tasks" hidden></section>
    <section id="v-pas" data-view="pas" aria-label="PAs" hidden></section>
    <section id="v-shifts" data-view="shifts" aria-label="PA shifts" hidden></section>

  </main>
  <nav class="btabs" id="btabs" aria-label="Sections"></nav>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
<dialog id="confirmDlg" aria-labelledby="confirmTitle"></dialog>
<div id="toasts" aria-live="polite" aria-relevant="additions"></div>
<datalist id="tplNames"></datalist>
<datalist id="locNames"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
(function(){
'use strict';
/* ==========================================================================
   Roots PA Task Sheet v2
   Data lives in Supabase, one row per thing. Every write is a single-row,
   field-level change (PostgREST update by id), so a stale tab can only ever
   touch the fields it actually edits. Nothing here writes a whole week.

/* department of a shift, matching the Roots Google calendar colours (v2.2). Rows with no department
   fall back to the program's prefix ("The Grove: Legacy", "Bloom Saturday School", "College Sisters"). */
function deptOf(s){
  var d = String((s && s.dept) || '').trim().toLowerCase().replace(/^the\s+/, '');
  if (d === 'grove') return 'The Grove'; if (d === 'bloom') return 'Bloom'; if (d === 'college') return 'College'; if (d === 'community') return 'Community';
  if (d) return s.dept.trim();
  var p = String((s && s.program) || '').trim().toLowerCase();
  if (/^(the\s+)?grove\b/.test(p)) return 'The Grove';
  if (/^bloom\b/.test(p)) return 'Bloom';
  if (/^college\b/.test(p)) return 'College';
  if (/^community\b/.test(p)) return 'Community';
  return '';
}
function deptClass(s){ return DEPT_CLASS[deptOf(s)] || ''; }
/* program names on the calendar and on the board, compared without the department prefix and any
   "(...)": "The Grove: Legacy (Ages 9-12)" and "Legacy " are the same program */
function progKey(name){
  return String(name || '').toLowerCase().replace(/\([^)]*\)/g, ' ')
    .replace(/^\s*(the\s+grove|grove|community|college|bloom)\s*[:\-\u2013]\s*/, '').replace(/^\s*bloom\s+/, '')
    .replace(/[\s.,:;!]+$/, '').replace(/\s+/g, ' ').trim();
}

/* ---------- tiny helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function h(tag, a){
  var el = document.createElement(tag);
  if (a) for (var k in a){
    var v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'on') { for (var ev in v) el.addEventListener(ev, v[ev]); }
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected' || k === 'open') el[k] = v;
    else if (k === 'style' && typeof v === 'object') { for (var sk in v) el.style.setProperty(sk, v[sk]); }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(el, x); }); return; }
  el.append(c.nodeType ? c : String(c));
}

var preDone = new Map();   // task id -> who had already checked off before the main box was ticked
function setTaskDone(id, val){

  else preDone.delete(id);
  setFields('tasks', id, {done: val}, taskLabel(t));
  // unticking by mistake gives people back their own check-offs instead of wiping them (review L8)
  assigneesOf(id).forEach(function(x){ setFields('task_people', x.task_id + '|' + x.person_id, {done: val ? true : !!(before && before.has(x.person_id))}, taskLabel(t)); });
  invalidate('board', 'person');

}
function syncTaskDone(id){

  var t = D.tasks.get(id); if (!t) return;
  var a = liveAssignees(id);

    setFields('tasks', id, {done: false}, taskLabel(t));

  if (x) setFields('task_people', key, {done: val}, taskLabel(t));
  syncTaskDone(id);
  invalidate('board', 'person');
  announce(personName(pid) + (val ? ' checked off ' : ' unchecked ') + quote(t.task));
}

  var prev = addDays(S.week, -7), team = S.team, week = S.week;
  S.copying = true;
  toast('Looking at last week\u2026', {timeout: 2500});
  var res;
  try { res = await fetchWeek(team, prev); } catch (e){ res = [{error: e}]; }
  try {
    if (team !== S.team || week !== S.week) return;
    if (res[0].error){ toast('Couldn\u2019t open last week. ' + plainError(res[0].error), {kind: 'error'}); return; }
    var existing = weekPrograms(), made = [], madeTasks = [], n = 0, skipped = 0;
    var have = new Set();
    existing.forEach(function(p){ tasksOf(p.id).forEach(function(t){ if (t.source && /^copy:/.test(t.source)) have.add(t.source.slice(5)); }); });
    var norm = function(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); };
    var base = nextSort(existing);
    res[0].data.sort(bySort).forEach(function(sp, i){      // keep last week's card order (review L10)
      var open = (sp.tasks || []).filter(function(t){
        if (t.deleted_at) return false;
        var tps = t.task_people || [];
        return !(t.done || (tps.length && tps.every(function(x){ return x.done; })));
      }).sort(bySort);

      var todo = open.filter(function(ot){ var dup = have.has(ot.id) || already.has(norm(ot.task)); if (dup) skipped++; return !dup; });
      if (!todo.length) return;

async function loadHistory(older){

  // pages go by id, so "Show older changes" keeps working past 1000 entries (review P8)

  if (needS.size) jobs.push(sb.from('shifts').select('id,program,date').in('id', Array.from(needS).slice(0, 150)).then(function(x){ (x.data || []).forEach(function(s){ S.histNames.shifts[s.id] = shiftLabel(s); }); }));
  if (needP.size) jobs.push(sb.from('programs').select('id,name,personal').in('id', Array.from(needP).slice(0, 150)).then(function(x){ (x.data || []).forEach(function(p){ S.histNames.programs[p.id] = p.personal ? '' : progLabel(p); }); }));
  try { await Promise.all(jobs); } catch (e){}

}
/* the assistant's own label ("Po (agent)" -> "Po", "Rosie (agent)" -> "Rosie"), not a hard-coded name (v2.2) */

var FIELD_WORDS = {name: 'name', date: 'date', locations: 'place', offsite: 'offsite address', lead_ids: 'leads', grp: 'group', tasks: 'tasks', label: 'name', url: 'address',
  program: 'program', location: 'location', dept: 'department', pa_needed: 'PAs needed', time_text: 'time', start_time: 'time', end_time: 'time', due: 'due day', notes: 'notes', template_id: 'Master program'};

async function restoreEntry(e, btn){
  btn.disabled = true;

  if (e.op === 'UPDATE' && e.old && e.new && T[e.tbl]){
    var ch = changedKeys(e.old, e.new), patch = {};
    ch.forEach(function(k){ if (k !== 'id' && k !== 'team') patch[k] = e.old[k]; });
    if (!ch.length){ btn.disabled = false; return; }
    var m = {}; T[e.tbl].pk.forEach(function(k){ m[k] = e.old[k]; });
    r = await sb.from(e.tbl).update(patch).match(m).select();
    if (!r.error && Array.isArray(r.data) && !r.data.length) r = {error: {message: 'not found', code: 'NOROW'}};
  } else {
    r = await sb.rpc('restore_row', {p_history_id: e.id});
  }
  btn.disabled = false;
  if (r.error){ toast('Couldn\u2019t restore that. ' + plainError(r.error), {kind: 'error'}); return; }

   Month: the same strip, one row per week. A person picked: only their programs, their tasks under each day.
   Programs come from the Roots calendar (hourly sync); only sign-ups and tasks change here.
   ========================================================================== */

/* ---------- matching a calendar event to its board program (same rules as the hourly sync) ---------- */
var NAME_STOP = {the: 1, and: 1, a: 1, of: 1, 'for': 1, ages: 1, at: 1, me: 1};
function nameBase(name){
  var s = String(name || '').toLowerCase().replace(/\([^)]*\)/g, ' ').trim();
  s = s.replace(/^(community|college|bloom|the grove|grove)\s*:?\s*/, '');
  return s.replace(/[^a-z0-9 ]/g, ' ');
}
function nameWords(name){ var out = []; nameBase(name).split(/\s+/).forEach(function(w){ if (w.length > 1 && !NAME_STOP[w] && out.indexOf(w) < 0) out.push(w); }); return out; }
/* 0..1. 1 = same program; 0.9 = one name's words are all in the other ("Teen Talk" / "Teen Talk / Faithful");
   0.8 = initials ("ETQ" / "Exploring the Quran"). Below 0.8 is treated as a different program. */
function matchScore(a, b){
  var ca = nameBase(a).replace(/ /g, ''), cb = nameBase(b).replace(/ /g, '');
  if (ca && ca === cb) return 1;
  var tries = [[ca, b], [cb, a]];
  for (var i = 0; i < 2; i++){
    var short = tries[i][0], full = tries[i][1];
    var ini = nameBase(full).split(/\s+/).filter(Boolean).map(function(w){ return w[0]; }).join('');
    if (short.length >= 2 && short.length <= 5 && ini.indexOf(short) === 0) return 0.8;
  }
  var x = nameWords(a), y = nameWords(b);
  if (!x.length || !y.length) return 0;
  var inter = x.filter(function(w){ return y.indexOf(w) >= 0; }).length;
  if (inter === x.length || inter === y.length) return 0.9;
  return inter / Math.max(x.length, y.length);
}
/* pair each event with at most one program and each program with at most one event, best match first */
function pairWeek(events, progs){
  var cand = [];
  events.forEach(function(e){
    progs.forEach(function(p){
      if (p.deleted_at || p.personal || !(p.name || '').trim()) return;
      var pd = validIso(p.date) ? p.date : '';
      if (pd && e.date && pd !== e.date) return;            // a card with a date only matches that day's event
      var sc = matchScore(e.program, p.name); if (sc < 0.8) return;
      if (pd && pd === e.date) sc += 0.05;
      cand.push({e: e, p: p, sc: sc});
    });
  });
  cand.sort(function(a, b){ return b.sc - a.sc || String(a.e.date || '').localeCompare(String(b.e.date || '')) || shiftMinutes(a.e) - shiftMinutes(b.e) || bySort(a.p, b.p); });
  var byEv = new Map(), byProg = new Map();
  cand.forEach(function(c){ if (byEv.has(c.e.id) || byProg.has(c.p.id)) return; byEv.set(c.e.id, c.p); byProg.set(c.p.id, c.e); });
  return {byEv: byEv, byProg: byProg};
}
function eventsIn(a, z){
  return Array.from(D.shifts.values()).filter(function(s){ return s.date && s.date >= a && s.date <= z && shiftShown(s); }).sort(byShiftTime);
}
/* this week's pairs, rebuilt whenever anything changes (IX is dropped on every change) */
function calPairs(){

}
function templateFor(s){
  var best = null, bs = 0;
  activeTemplates().forEach(function(t){ if (!(t.name || '').trim()) return; var sc = matchScore(s.program, t.name); if (sc >= 0.8 && sc > bs){ best = t; bs = sc; } });
  return best;

function normTask(x){ return String(x || '').trim().toLowerCase().replace(/\s+/g, ' '); }
/* "Add the N template tasks": only when a template matches and none of its tasks are on the card yet */

  if (!tt.length) return null;

function eventWeek(s){ return s.date ? mondayOf(isoToDate(s.date)) : null; }

/* the board card for an event this week; the first task added to an event with no card makes one */

    personal: false, date: s.date, locations: [], offsite: '', lead_ids: [], sort: nextSort(weekPrograms())}, name);

    made.forEach(function(t){ if (D.tasks.has(t.id)) setFields('tasks', t.id, {deleted_at: nowIso()}, taskLabel(t)); }); invalidate('cal', 'board', 'person');

/* ---------- month: the same strip, one row per week, a week label on the left that opens that week ---------- */

  if (replace) history.replaceState(null, '', hs); else history.pushState(null, '', hs);

/* #team/2026-10-12/board. Anything that isn't a real date, month or tab is ignored and the
   address is corrected (B8). Old names (templates, team) still work. */
function parseHash(){
  var p = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/'), out = {bad: false};
  if (p[0]){ if (/^[a-z0-9_-]{2,40}$/i.test(p[0])) out.team = p[0].toLowerCase(); else out.bad = true; }
  if (p[1]){
    if (validIso(p[1])) out.week = mondayOf(isoToDate(p[1]));
    else if (validMonth(p[1])) out.month = p[1];
    else { out.bad = true; if (/^\d{4}-\d{1,2}$/.test(p[1])) out.monthish = true; }
    if (out.week && out.week !== p[1]) out.bad = true;
  }
  var tab = TAB_ALIAS[p[2]] || p[2];
  if (p[2]){ if (TABS.some(function(t){ return t.id === tab; })) out.tab = tab; else out.bad = true; }
  if ((out.tab || 'cal') === 'cal' && (out.week || out.month || out.monthish)) out.mode = out.week ? 'week' : 'month';
  return out;
}

/* o: {tab, week, month, mode}. mode is PA shifts' "week" or "month". Asking for a month
   (and no week) means the month view; asking for a week on PA shifts means the week view. */
function go(o, replace){
  if (!S.team) return;
  var prevTab = S.tab, prevWeek = S.week, prevMonth = S.month, prevMode = S.calMode;
  if (o.tab && tabOk(o.tab)){ S.tab = o.tab; S.tabPicked = true; }
  var mode = o.mode || (S.tab !== 'cal' ? null : o.month && !o.week ? 'month' : o.week && !o.month ? 'week' : null);
  if (mode === 'month' && S.calMode !== 'month' && !o.month) S.month = monthOf(addDays(S.week, 3));      // the month holding most of the week
  if (mode === 'week' && S.calMode !== 'week' && !o.week) S.week = S.month === thisMonth() ? thisWeek() : mondayOf(addDays(isoToDate(S.month + '-01'), 3));
  if (mode) S.calMode = mode;
  if (o.week) S.week = o.week;
  if (o.month) S.month = o.month;
  writeHash(replace);
  if (S.week !== prevWeek){ flushAllPend(); loadWeek(); }
  ensureShifts();
  if (S.tab === 'history' && (prevTab !== 'history' || !S.hist)) loadHistory();
  if (S.calMode !== prevMode){ invalidate('cal'); S.calScrollTo = o.day || null; }
  else if (o.day) S.calScrollTo = o.day;
  showTab(prevTab !== S.tab);
  renderHeader();
  if (prevTab !== S.tab) announce((TABS.find(function(t){ return t.id === S.tab; }) || {}).label);
  else if (S.calMode !== prevMode) announce(S.calMode === 'week' ? weekLabel(S.week) : monthLabel(S.month));
  else if (S.week !== prevWeek) announce(weekLabel(S.week));
  else if (S.month !== prevMonth) announce(monthLabel(S.month));
}

function onHashChange(){

    if (S.teams.some(function(t){ return t.team === r.team; })){ enterTeam(r.team, r); return; }

/* A page left open overnight, or reopened from the address it was on yesterday, moves itself to
   the current week, so nobody files Monday's tasks into last week (review M3). */
var dayNow = null;
function checkNewDay(){
  var today = todayIso();
  if (!dayNow){ dayNow = today; return; }
  if (today === dayNow) return;
  var oldWeek = mondayOf(isoToDate(dayNow)), oldMonth = monthOf(dayNow);
  dayNow = today;
  var o = {};
  if (S.week === oldWeek && thisWeek() !== oldWeek) o.week = thisWeek();
  if (S.month === oldMonth && thisMonth() !== oldMonth) o.month = thisMonth();
  if (Object.keys(o).length){ go(o, true); if (o.week && WEEK_TABS[S.tab]) toast('It\u2019s a new week. Showing the ' + weekLabel(S.week).replace('Week of', 'week of') + '.'); }
  invalidate('board', 'person', 'shifts', 'cal', 'header');    // Today and Overdue move on
}

function drain(ms){
  return new Promise(function(res){
    var end = Date.now() + ms;
    (function tick(){
      if ((!Q.items.length && !Q.busy && !Pend.size) || Date.now() > end || Q.paused) return res(!Q.items.length);
      kick(); setTimeout(tick, 120);
    })();
  });
}

/* ---------- CSV ---------- */
function csvCell(v){
  v = String(v == null ? '' : v);
  // anything a spreadsheet could read as a formula starts with ' (B14)
  if (/^\s*[=+\-@]/.test(v) || /^[\t\r]/.test(v)) v = '\'' + v;
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportCsv(){
  if (S.weekLoaded !== S.week){ toast('This week is still loading. Try again in a moment.'); return; }
  var rows = [['Program', 'Date', 'Where', 'Task', 'Notes', 'Assigned to', 'Due', 'Done', 'Done by']];
  weekPrograms().forEach(function(p){
    tasksOf(p.id).forEach(function(t){
      var as = assigneesOf(t.id);
      rows.push([p.personal ? ((p.name || '').trim() || 'Personal') : progLabel(p), p.date || '', (p.locations || []).map(function(l){ return l === OFFSITE && p.offsite ? 'Offsite: ' + p.offsite : l; }).join('; '),
        t.task || '', t.notes || '', as.map(function(x){ return personName(x.person_id); }).join(', '), t.due || '', taskDone(t) ? 'Yes' : 'No',
        as.filter(function(x){ return x.done || t.done; }).map(function(x){ return personName(x.person_id); }).join(', ')]);
    });
  });
  var csv = '\ufeff' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var url = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  var a = h('a', {href: url, download: 'roots-tasks-' + S.team + '-' + S.week + '.csv'});
  document.body.append(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);   // iPhone may ask before downloading (review P10)
  toast('Downloaded ' + (rows.length - 1) + (rows.length === 2 ? ' task' : ' tasks') + ' as CSV. Open it in Google Sheets with File, Import.');
}

/* ---------- drag to reorder (mouse / pen; touch uses Move up / Move down) ---------- */
function mergeOrder(all, visibleIds){
  var vis = new Set(visibleIds), slots = [], out = all.slice();
  all.forEach(function(x, i){ if (vis.has(x.id)) slots.push(i); });
  var byId = new Map(all.map(function(x){ return [x.id, x]; }));
  slots.forEach(function(si, k){ out[si] = byId.get(visibleIds[k]); });
  return out;
}
function wireDrag(root){
  if (root._drag) return; root._drag = true;
  root.addEventListener('pointerdown', function(e){
    var hd = e.target.closest('[data-drag]'); if (!hd || e.button !== 0 || e.pointerType === 'touch') return;
    var kind = hd.dataset.drag, sel = kind === 'card' ? 'li.card' : 'li.task';
    var item = hd.closest(sel); if (!item) return;
    var list = item.parentElement;
    e.preventDefault();
    item.classList.add('dragging');
    var target = null, after = false;
    function clear(){ $$('.drop-before,.drop-after', list).forEach(function(x){ x.classList.remove('drop-before', 'drop-after'); }); }
    function move(ev){
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var over = el && el.closest(sel);
      clear();
      if (ev.clientY < 90) window.scrollBy(0, -12); else if (ev.clientY > innerHeight - 60) window.scrollBy(0, 12);
      if (!over || over === item || over.parentElement !== list){ target = null; return; }
      var r = over.getBoundingClientRect();
      after = kind === 'card' && list.clientWidth > r.width * 1.5 ? ev.clientX > r.left + r.width / 2 : ev.clientY > r.top + r.height / 2;
      over.classList.add(after ? 'drop-after' : 'drop-before'); target = over;
    }
    function up(){
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      item.classList.remove('dragging'); clear(); S.pointerDown = false;
      if (target){
        var ids = Array.prototype.map.call(list.children, function(c){ return c.dataset.id; }).filter(function(id){ return id && id !== item.dataset.id; });
        ids.splice(ids.indexOf(target.dataset.id) + (after ? 1 : 0), 0, item.dataset.id);
        if (kind === 'card') applyOrder('programs', mergeOrder(boardPrograms(), ids));
        else { var t = D.tasks.get(item.dataset.id); if (t) applyOrder('tasks', mergeOrder(tasksOf(t.program_id), ids)); }
        announce('Moved');
      }
      invalidate('board', 'person', 'cal');
    }
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}
