<style>
:root{
  --ink:#1d2330; --muted:#545b69; --line:#d6dae3; --line2:#e8ebf0; --bg:#f4f5f8; --card:#fff;
  --accent:#6b4fbb; --accent-ink:#6b4fbb; --accent-soft:#efeaf9;
  --ok:#1d6b41; --ok-bg:#e2f3e9; --warn:#7f4500; --warn-bg:#fff0d9; --err:#a3261b; --err-bg:#fdecea;
  --r:12px; --r-s:10px; --tap:44px; --fs:16px; --fs-s:13px; --fs-l:20px;
  --sp1:4px; --sp2:8px; --sp3:16px; --sp4:24px; --sp5:32px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.06);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 var(--font);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
[hidden]{display:none !important}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:var(--fs-l)} h2{font-size:var(--fs-l);font-weight:650} h3{font-size:var(--fs);font-weight:650}
p{margin:0 0 var(--sp2)}
a{color:var(--accent-ink)}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)} .small{font-size:var(--fs-s)}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px}
.skip:focus{top:8px}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline-offset:0}

/* ---------- controls ---------- */
button,.btn{font:inherit;font-size:var(--fs-s);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-s);min-height:var(--tap);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover{background:#f7f8fa}
button:disabled{opacity:.5;cursor:default}
button.primary,.btn.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{background:var(--err);border-color:var(--err);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:rgba(0,0,0,.05)}
button.link{background:none;border:none;color:var(--accent-ink);text-decoration:underline;padding:0 8px;min-width:var(--tap)}
button.icon{width:var(--tap);min-width:var(--tap);padding:0;background:transparent;border-color:transparent;color:var(--muted)}
button.icon:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
input[type=text],input[type=password],input[type=email],input[type=search],input[type=url],input[type=date],textarea,select{
  font:inherit;font-size:var(--fs);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--r-s);
  min-height:var(--tap);padding:9px 11px;width:100%;max-width:100%}
textarea{resize:none;display:block;line-height:1.4;field-sizing:content;overflow:hidden}
select{padding-right:28px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
::placeholder{color:#6a7180;opacity:1}
label.field{display:block;font-size:var(--fs-s);font-weight:600;margin:0 0 var(--sp1)}
.cb{width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;margin:0}
.cb input{width:22px;height:22px;margin:0;accent-color:var(--accent-ink);cursor:pointer}

/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:var(--sp5) var(--sp3)}
.login-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:var(--sp4);width:100%;max-width:420px}
.login-card h1{margin-bottom:var(--sp1)}
.login-card h1 span{color:var(--muted);font-weight:500}
.team-pick{display:grid;gap:var(--sp2);margin:var(--sp2) 0 var(--sp3)}
.team-pick label{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:2px solid var(--line);border-radius:var(--r);cursor:pointer;font-weight:600}
.team-pick input{width:20px;height:20px;accent-color:var(--tc)}
.team-pick label:has(input:checked){border-color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,#fff)}
.team-pick label:has(input:focus-visible){outline:3px solid var(--tc);outline-offset:2px}
.tdot{width:14px;height:14px;border-radius:50%;background:var(--tc,var(--accent));flex:0 0 auto}
fieldset{border:none;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:var(--fs-s);padding:0}
.pwrow{display:flex;gap:var(--sp2)}
.pwrow input{flex:1}
.err{color:var(--err);background:var(--err-bg);border-radius:var(--r-s);padding:10px 12px;margin:var(--sp2) 0;font-size:var(--fs-s);font-weight:600}
.okmsg{color:var(--ok);background:var(--ok-bg);border-radius:var(--r-s);padding:10px 12px;margin:var(--sp2) 0;font-size:var(--fs-s);font-weight:600}
.login-card form>button[type=submit]{width:100%;margin-top:var(--sp3)}
.login-alt{margin-top:var(--sp3);text-align:center}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:var(--card);border-top:4px solid var(--accent);box-shadow:0 1px 0 var(--line);padding-top:env(safe-area-inset-top)}
.hdr1{display:flex;align-items:center;gap:var(--sp2);padding:6px var(--sp2) 0 var(--sp2)}
.teamsw{border:none;background:none;padding:0 8px;gap:8px;max-width:58vw;justify-content:flex-start}
.teamsw .tdot{--tc:var(--accent)}
.teamsw .tn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.teamsw .tn b{font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.save{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.save.saving{background:#eef0f4;color:var(--muted)}
.save.offline{background:var(--warn-bg);color:var(--warn)}
.save.error{background:var(--err-bg);color:var(--err)}
.save .ic{width:16px;height:16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px var(--sp2) 0;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;display:inline-flex;align-items:center;min-height:var(--tap);padding:0 12px;font-size:var(--fs-s);font-weight:650;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:#f6f7f9}
.tabs a[aria-current=page]{color:var(--accent-ink);border-bottom-color:var(--accent-ink)}
.wnav{display:flex;align-items:center;gap:var(--sp1);padding:6px var(--sp2);border-top:1px solid var(--line2)}
.wnav h2{font-size:var(--fs);flex:1;text-align:center;font-weight:700}
.wnav .today-btn{padding:0 12px}

#main{padding:var(--sp3) var(--sp3) calc(96px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}
.view-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2);margin-bottom:var(--sp3)}
.view-head .grow{flex:1;min-width:160px}
.view-head h2{font-size:var(--fs-l)}
.summary{font-size:var(--fs-s);color:var(--muted);font-weight:600}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:var(--fs-s);margin-bottom:var(--sp3)}
.loaderr{background:var(--err-bg);color:var(--err);border-radius:var(--r);padding:16px;font-weight:600}


/* ---------- board ---------- */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:var(--sp3);align-items:start}
@media (min-width:768px){.cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:hidden;min-width:0}
.card.dragging{opacity:.5}
.card.drop-before{box-shadow:-4px 0 0 var(--accent-ink),var(--shadow)}
.card-head{background:var(--pastel,#eee);padding:var(--sp2) var(--sp2) var(--sp2) var(--sp3)}
.ch-row{display:flex;align-items:center;gap:var(--sp1)}
.ch-row .pname{font-weight:700;background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.12)}
.progress{display:flex;align-items:center;gap:var(--sp2);margin-top:var(--sp2);font-size:var(--fs-s);font-weight:700}
.bar{flex:1;height:8px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.tasks{list-style:none;margin:0;padding:0}
.task{border-top:1px solid var(--line2);padding:var(--sp1) var(--sp2) var(--sp2) 0;position:relative}
.task.drop-before{box-shadow:inset 0 3px 0 var(--accent-ink)}

.task.dragging{opacity:.45}
.trow{display:flex;align-items:flex-start;gap:2px}
.trow textarea{flex:1;min-width:0;font-weight:600;border-color:transparent;background:transparent;padding:10px 8px}

.trow textarea:focus{border-color:var(--accent-ink);background:#fff}
.task.done{background:var(--ok-bg)}
.task.done .trow textarea{text-decoration:line-through;color:#2f5d43}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:var(--tap);margin-top:2px}
.tnotes{margin:6px 0 0 var(--tap);width:calc(100% - var(--tap));font-size:var(--fs-s);min-height:36px;padding:7px 10px;border-color:transparent;background:rgba(0,0,0,.025);font-style:italic}
.tnotes:hover{border-color:var(--line)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:var(--fs-s);font-weight:600;color:var(--ink)}
.chip.on{background:var(--ok-bg);border-color:#9fd1b3}

.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:.02em}
.chip .tick{width:16px;height:16px;color:var(--ok)}
.addtask{display:flex;gap:var(--sp1);padding:var(--sp2);border-top:1px dashed var(--line)}
.addtask input{flex:1}
.drag{cursor:grab;color:#8b919c;display:none;align-items:center;justify-content:center;width:22px;min-height:var(--tap);flex:0 0 auto}
@media (hover:hover) and (pointer:fine){.drag{display:inline-flex}}
.empty{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--sp4);max-width:560px;margin:var(--sp3) auto;text-align:center}
.empty h2{margin-bottom:var(--sp2)}

.skel{background:linear-gradient(90deg,#eceef2 0%,#f6f7f9 50%,#eceef2 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:8px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-card{height:260px;border-radius:var(--r)}

/* ---------- by person ---------- */
.pv-top{display:flex;flex-wrap:wrap;gap:var(--sp2);align-items:flex-end;margin-bottom:var(--sp3)}
.pv-top .sel{flex:1;min-width:180px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp2);margin-top:var(--sp3)}
.who-grid button{justify-content:flex-start;min-height:56px;font-size:var(--fs)}
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:var(--sp3);overflow:hidden;border:1px solid var(--line2)}
.day>h3{padding:10px var(--sp3);background:#f7f8fa;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:var(--sp2)}
.day>h3 .muted{font-weight:500;font-size:var(--fs-s)}
.day.today{border-color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-ink),var(--shadow)}
.day.today>h3{background:var(--accent-soft);color:var(--accent-ink)}
.pv-list{list-style:none;margin:0;padding:0}
.pv-item{display:flex;align-items:flex-start;gap:var(--sp1);padding:var(--sp1) var(--sp3) var(--sp1) var(--sp1);border-top:1px solid var(--line2)}
.pv-item:first-child{border-top:none}
.pv-item.done{background:var(--ok-bg)}
.pv-item.done .pv-t{text-decoration:line-through;color:#2f5d43}
.pv-body{flex:1;min-width:0;padding:10px 0}
.pv-t{font-weight:600;word-break:break-word}
.pv-m{font-size:var(--fs-s);color:var(--muted);margin-top:2px;word-break:break-word}
.pv-body textarea{font-weight:600}

/* ---------- shifts ---------- */
.sgroup{margin-bottom:var(--sp4)}
.sgroup>h3{margin:0 0 var(--sp2);font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.shifts{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp2)}
.shift{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);border-left:6px solid #c9ced8;padding:var(--sp2);display:grid;grid-template-columns:var(--tap) 1fr var(--tap);gap:6px var(--sp2);align-items:start}
.shift.dept-grove{border-left-color:#3d7bc4;background:#f1f7fe}
.shift.dept-bloom{border-left-color:#c9a000;background:#fffbea}
.shift.dept-college{border-left-color:#d97a1c;background:#fff5ea}
.shift.dept-community{border-left-color:#6b4fbb}
.shift.done .s-prog,.shift.done .s-date,.shift.done .s-time{text-decoration:line-through;color:var(--muted)}
.s-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px var(--sp2);min-width:0}
.s-fields .wide{grid-column:1/-1}
.s-f label{display:block;font-size:var(--fs-s);font-weight:600;color:#3d4350;margin-bottom:2px}
.s-hint{font-size:var(--fs-s);color:var(--warn);margin-top:2px;font-weight:600}
.s-nice{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
.s-pa{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.s-pa select{width:auto;min-width:110px;font-size:var(--fs-s);min-height:36px;padding:4px 26px 4px 10px}
.s-head{display:none}
@media (min-width:1100px){
  .shift{grid-template-columns:var(--tap) 1fr var(--tap);padding:6px var(--sp2)}
  .s-fields{grid-template-columns:150px 150px minmax(200px,1.6fr) minmax(130px,.8fr) minmax(250px,1.4fr) 130px;align-items:start}
  .s-fields .wide{grid-column:auto}
  .s-f label{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .s-head{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);gap:var(--sp2);padding:0 var(--sp2) 6px 14px;font-size:var(--fs-s);font-weight:700;color:var(--muted)}
  .s-head .s-fields>span{padding-left:4px}
}

/* ---------- templates / links / notes / history / settings ---------- */
.notes-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--sp3);max-width:860px}
.notes-card textarea{min-height:320px}

.hist li:first-child{border-top:none}
.hist .hx{flex:1;min-width:0;word-break:break-word}
.hist .when{font-size:var(--fs-s);color:var(--muted);white-space:nowrap}
.hday{font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:var(--sp3) 0 var(--sp2);font-weight:700}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--sp3);margin-bottom:var(--sp3);max-width:720px;border:1px solid var(--line2)}
.panel h2{margin-bottom:var(--sp2);font-size:var(--fs-l)}
.prow{display:flex;align-items:center;gap:var(--sp2);padding:6px 0;border-top:1px solid var(--line2)}
.prow:first-of-type{border-top:none}
.prow input{flex:1}
.formrow{display:flex;gap:var(--sp2);margin-top:var(--sp2)}
.formrow input{flex:1}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:var(--fs-s);font-weight:600;margin:var(--sp2) 0}
.stack{display:grid;gap:var(--sp2)}

/* ---------- sheets, toasts ---------- */
dialog{border:none;padding:0;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 48px);color:var(--ink)}

dialog[open]{display:flex;flex-direction:column}

}
.sh-head{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) var(--sp2) var(--sp2) var(--sp3);border-bottom:1px solid var(--line2)}
.sh-head h2{flex:1;font-size:var(--fs);font-weight:700;word-break:break-word}
.sh-body{padding:var(--sp3);overflow:auto;display:grid;gap:var(--sp2);align-content:start}
.sh-foot{display:flex;gap:var(--sp2);justify-content:flex-end;padding:var(--sp2) var(--sp3) var(--sp3);flex-wrap:wrap}
.sh-foot button{min-width:96px}
.optlist{display:grid;gap:4px}
.opt{display:flex;align-items:center;gap:var(--sp2);min-height:var(--tap);padding:4px 8px;border-radius:var(--r-s);cursor:pointer;font-weight:600;border:1px solid transparent;width:100%;justify-content:flex-start;background:none;text-align:left}
.opt:hover{background:#f4f5f8}
.opt input{width:20px;height:20px;accent-color:var(--accent-ink);margin:0 4px}
.opt.dis{opacity:.55;cursor:default}
.opt.add{color:var(--accent-ink);border:1px dashed var(--line)}
.opt .sub{font-weight:500;color:var(--muted);font-size:var(--fs-s);margin-left:auto}
.optgroup-h{font-size:var(--fs-s);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:var(--sp2) 0 2px}
.menu-list{display:grid;gap:4px}
.menu-list button{justify-content:flex-start;border:none;background:none;font-size:var(--fs);font-weight:500;width:100%}
.menu-list button:hover{background:#f4f5f8}
.menu-list .sep{height:1px;background:var(--line2);margin:4px 0}
.hint{font-size:var(--fs-s);color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:var(--r-s);font-weight:600}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:grid;gap:var(--sp2);width:min(560px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;background:#1f2430;color:#fff;border-radius:var(--r);padding:6px 6px 6px 16px;display:flex;align-items:center;gap:var(--sp2);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:var(--fs-s);font-weight:600;min-height:52px}
.toast span{flex:1}
.toast.error{background:#8c1d13}
.toast button{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);min-height:40px}

@media (min-width:768px){

  .hdr1{padding:8px var(--sp3) 0}

  .wnav h2{flex:0 0 auto;min-width:220px}
  #main{padding:var(--sp4) var(--sp4) 96px}
}

  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .skel{animation:none}
}
@media print{
  .hdr .tabs,.hdr .wnav button,.save,#menuBtn,.teamsw .ic,.addtask,.drag,button.icon,.addp,.view-head,#toasts,.skip,.empty .acts,.btabs{display:none !important}
  body{background:#fff}
  .hdr{position:static;box-shadow:none;border-top:none}
  #main{padding:0}

  textarea,input,select{border:none !important;background:transparent !important;padding:2px 4px !important;min-height:0 !important}

   v2.1: simpler header, bottom tabs on phones, compact cards and rows
   ========================================================================== */

label.field.gap{margin-top:12px}

/* ---------- header: one row ---------- */
.hdr1{display:flex;align-items:center;gap:var(--sp2);padding:4px var(--sp2);min-height:52px}

.btabs .bt[aria-current=page],.btabs .bt.on{color:var(--accent-ink)}

.pmeta{display:flex;width:100%;justify-content:flex-start;text-align:left;background:none;border:none;padding:0 6px;min-height:32px;font-size:var(--fs-s);font-weight:600;color:#2f3542;

.addp{position:relative;width:32px;min-width:32px;min-height:32px;padding:0;border:none;background:none;color:var(--accent-ink);border-radius:50%}

.tchip:has(input:focus-visible){outline:3px solid var(--accent-ink);outline-offset:2px}
.tchip .av{width:24px;height:24px;font-size:11px}
.sh-body input[type=date]{width:auto;min-width:180px}

/* ---------- by person ---------- */
.pv-top select{max-width:420px}
.who-grid .sub{margin-left:auto}
.pv-body{padding:0}
.pv-body textarea{font-weight:500;border-color:transparent;background:transparent;padding:10px 6px}
.pv-body textarea:focus{border-color:var(--accent-ink);background:#fff}
.pv-item.done .pv-body textarea{text-decoration:line-through;color:#52705e}
.pv-item.done{background:#eef7f1}
.pv-m{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 6px 8px;margin:0}
.pv-body .tnotes{margin:0 0 8px;width:100%}
.pv-add{margin-top:var(--sp2);background:var(--card);border-radius:var(--r);border:1px solid var(--line2)}
.day>h3{padding:8px var(--sp3)}

/* ---------- PA shifts: cards on phones, the old table on desktop ---------- */
.shift.done .s-prog{text-decoration:line-through;color:var(--muted)}
.s-lab{display:block;font-size:var(--fs-s);font-weight:600;color:#3d4350;margin-bottom:2px}
.s-pa .addp{margin-left:2px}
.s-pa .chip{min-height:30px}
.s-fields .f-prog{grid-column:1/-1}
.s-fields .f-pa{grid-column:1/-1}
@media (max-width:1099px){
  .shift{grid-template-columns:var(--tap) minmax(0,1fr) var(--tap)}
  .s-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .s-fields input,.s-fields select{width:100%}
  .s-fields .f-prog{order:-1}
  .s-fields .f-loc,.s-fields .f-dept{grid-column:1/-1}
  .s-fields .f-dept select{max-width:220px}
  .s-prog{font-weight:700}
}
@media (min-width:1100px){
  .s-fields .f-prog,.s-fields .f-pa{grid-column:auto}
  .s-lab{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .shift{border-radius:0;box-shadow:none;border-top:none;border-right:none;border-bottom:1px solid var(--line2);padding:4px var(--sp2)}
  .shifts{gap:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line2)}
  .s-fields input[type=text],.s-fields input[type=date],.s-fields select{border-color:transparent;background:transparent}
  .s-fields input:hover,.s-fields select:hover{border-color:var(--line)}
  .s-fields input:focus,.s-fields select:focus{border-color:var(--accent-ink);background:#fff}
}
.sgroup>h3{text-transform:none;letter-spacing:0}

/* ---------- Master (plain grouped list; search on top) ---------- */
.tgroup{margin-bottom:var(--sp4)}
.tgroup>h3{margin:0 0 var(--sp2);font-size:var(--fs-s);color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:hidden}
.tplrow{border-top:1px solid var(--line2)}
.tplrow:first-child{border-top:none}
.tplrow summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3) 0 var(--sp2);font-weight:650}
.tplrow summary::-webkit-details-marker{display:none}
.tplrow summary .ic{transition:transform .15s;color:var(--muted)}
.tplrow details[open]>summary .ic{transform:rotate(90deg)}
.tplrow summary .grow{flex:1;min-width:0;word-break:break-word}
.tplrow summary .sub{font-weight:500;color:var(--muted);font-size:var(--fs-s)}
.tplrow .card.tpl{margin:0 var(--sp2) var(--sp2);box-shadow:none}
.cb-sp{width:var(--tap);flex:0 0 auto}
.tpl-task .tmeta{padding-left:var(--tap)}

/* ---------- Links (plain list) ---------- */
.links{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);max-width:760px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:var(--sp2);border-top:1px solid var(--line2);padding:2px 4px 2px var(--sp3)}
.lrow:first-child{border-top:none}
.lname{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:52px;text-decoration:none;padding:4px 0}
a.lname .lt{text-decoration:underline;font-weight:650;word-break:break-word}
.lname .host{font-size:var(--fs-s);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Notes ---------- */
.notes-h{font-size:var(--fs);margin-bottom:var(--sp2)}

/* phones + touch: every control at least 44px, form text at least 16px (no iOS zoom) */
@media (max-width:767px), (pointer:coarse){
  .chip,.tnotes,.toast button,button.link,.pmeta,.save .save-btn,.wnav .today-btn{min-height:44px}
  .chip.day{min-height:44px;min-width:44px;justify-content:center}
  .addp{width:44px;min-width:44px;min-height:44px}
  .addp::before{inset:8px}
  .addp::after{inset:0}
  .s-pa .chip{min-height:44px}
  .tnotes{font-size:16px}
  .tmeta{gap:6px}
  .tmeta:has(> .addp:only-child){margin-top:-8px}
}
@media print{
  .btabs,#wnav button,.pmeta.empty{display:none !important}
  .card.is-today{box-shadow:none}
}

/* desktop: a row's ⋯ is faint until you point at or tab into the row (it stays a full 40 px target) */
@media (hover:hover) and (pointer:fine){
  .task .trow>button.icon,.pv-item>button.icon{opacity:.4}
  .task:hover .trow>button.icon,.task:focus-within .trow>button.icon,.pv-item:hover>button.icon,.pv-item:focus-within>button.icon{opacity:1}
}

/* big weeks: cards off screen skip layout and paint until scrolled near (B15) */
#v-board li.card{content-visibility:auto;contain-intrinsic-size:auto 420px}
@media print{ #v-board li.card{content-visibility:visible} }

/* the Board keeps its layout while another tab is showing, so coming back to a big week is instant (B15).
   content-visibility:hidden hides it from screen readers, keyboard and find, like display:none. */
#main>section#v-board[hidden]{display:block !important;content-visibility:hidden;contain-intrinsic-size:0 0;height:0;overflow:hidden;margin:0;padding:0}
@media print{ #main>section#v-board[hidden]{display:none !important} }

</style>

/* Quiet when everything is saved (small check + "Saved"); loud only when it matters.
   When the session has run out it becomes a button that reopens the sign-in sheet (B7). */
var lastSaveClass = '';
function updateSaveState(){

  var pending = Q.items.length + Pend.size, cls, text, ic, sr = '';
  if (Q.paused){ cls = 'error'; text = 'Sign in again to save'; ic = 'warn'; }
  else if (S.offline || !navigator.onLine){ cls = 'offline'; ic = 'cloudoff'; text = pending ? 'Offline: will save when back online' : 'Offline'; }
  else if (Q.failed){ cls = 'error'; text = 'Not saved yet, retrying\u2026'; ic = 'warn'; }
  else if (pending || Q.busy){ cls = 'saving'; text = 'Saving\u2026'; ic = 'clock'; }
  else { cls = 'ok'; text = 'Saved'; sr = 'All changes saved'; ic = 'check'; }

  lastSaveClass = cls; el.dataset.text = text;
  el.className = 'save ' + cls;
  var label = sr ? [h('span', {'aria-hidden': 'true', text: text}), h('span', {class: 'sr-only', text: sr})] : h('span', {text: text});
  var btn = $('#reauthBtn');
  if (Q.paused){

  } else {

}

var RT_TABLES = ['people', 'templates', 'links', 'programs', 'tasks', 'task_people', 'week_notes', 'shifts', 'shift_people'];
function subscribe(){

  if (S.session) try { sb.realtime.setAuth(S.session.access_token); } catch (e){}
  var team = S.team, ch = sb.channel('team-' + team + '-' + Date.now().toString(36)), joined = false;
  RT_TABLES.forEach(function(t){
    ch.on('postgres_changes', {event: '*', schema: 'public', table: t, filter: 'team=eq.' + team}, function(p){ onRemote(t, p); });
  });

    ch.on('postgres_changes', {event: 'DELETE', schema: 'public', table: t}, function(p){ onRemote(t, p); });
  });

    if (status === 'SUBSCRIBED'){

      // changes made between the first load and the live connection joining would be missed (review L1)
      else if (!joined && (S.weekLoaded || S.monthLoaded)) scheduleResync();

    return;
  }

  if (t === 'tasks' && !D.programs.has(row.program_id) && !D.tasks.has(row.id)) return;

/* Copy last week's unfinished tasks. Safe to press twice: a run in progress ignores more
   presses, and a task that is already on this week (copied before, or typed again) is skipped. (B2) */
async function copyLastWeek(){
  if (S.copying) return;
  if (S.weekLoaded !== S.week){ toast('This week is still loading. Try again in a moment.'); return; }
  var prev = addDays(S.week, -7), team = S.team, week = S.week;
  S.copying = true;
  toast('Looking at last week\u2026', {timeout: 2500});
  var res;
  try { res = await fetchWeek(team, prev); } catch (e){ res = [{error: e}]; }
  try {
    if (team !== S.team || week !== S.week) return;
    if (res[0].error){ toast('Couldn\u2019t open last week. ' + plainError(res[0].error), {kind: 'error'}); return; }
    var existing = weekPrograms(), made = [], madeTasks = [], n = 0, skipped = 0;
    var have = new Set();
    existing.forEach(function(p){ tasksOf(p.id).forEach(function(t){ if (t.source && /^copy:/.test(t.source)) have.add(t.source.slice(5)); }); });
    var norm = function(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); };
    var base = nextSort(existing);
    res[0].data.sort(bySort).forEach(function(sp, i){      // keep last week's card order (review L10)
      var open = (sp.tasks || []).filter(function(t){
        if (t.deleted_at) return false;
        var tps = t.task_people || [];
        return !(t.done || (tps.length && tps.every(function(x){ return x.done; })));
      }).sort(bySort);
      if (!open.length) return;
      // personal lists always get a fresh list; program cards match by template or name
      var target = sp.personal ? null : existing.find(function(p){ return !p.personal && ((sp.template_id && p.template_id === sp.template_id) || (norm(p.name) === norm(sp.name) && norm(sp.name))); });
      var already = target ? new Set(tasksOf(target.id).map(function(t){ return norm(t.task); })) : new Set();
      var todo = open.filter(function(ot){ var dup = have.has(ot.id) || already.has(norm(ot.task)); if (dup) skipped++; return !dup; });
      if (!todo.length) return;
      if (!target){
        target = insertRow('programs', {id: newId('prog_'), team: team, week: week, name: sp.name || '', template_id: sp.template_id, custom_name: !!sp.custom_name, force_pick: false,
          personal: !!sp.personal, date: '', locations: (sp.locations || []).slice(), offsite: sp.offsite || '', lead_ids: livePeople(sp.lead_ids), sort: base + i * 10}, sp.name);
        made.push(target); existing.push(target);
      }
      var sb0 = nextSort(tasksOf(target.id));
      todo.forEach(function(ot, k){
        var t = insertRow('tasks', {id: newId('t_'), team: team, program_id: target.id, task: ot.task || '', notes: ot.notes || '', due: ot.due || '', done: false, sort: sb0 + k * 10, source: 'copy:' + ot.id}, ot.task);
        madeTasks.push(t); n++; have.add(ot.id);
        livePeople((ot.task_people || []).map(function(x){ return x.person_id; })).forEach(function(pid){ insertRow('task_people', {task_id: t.id, person_id: pid, team: team, done: false}, ot.task); });
      });
    });
    invalidate('board', 'person');
    if (!n){ toast(skipped ? 'Last week\u2019s unfinished tasks are already on this week.' : 'Everything from last week was finished. Nothing to copy.'); return; }
    toast('Copied ' + n + (n === 1 ? ' open task' : ' open tasks') + ' from last week.', {timeout: 10000, action: {label: 'Undo', fn: function(){
      madeTasks.forEach(function(t){ if (D.tasks.has(t.id)) setFields('tasks', t.id, {deleted_at: nowIso()}, taskLabel(t)); });
      made.forEach(function(p){ if (D.programs.has(p.id)) setFields('programs', p.id, {deleted_at: nowIso()}, progLabel(p)); });
      invalidate('board', 'person');
    }}});
  } finally { S.copying = false; }
}

}

      var over = el && el.closest(sel);
      clear();
      if (ev.clientY < 90) window.scrollBy(0, -12); else if (ev.clientY > innerHeight - 60) window.scrollBy(0, 12);
      if (!over || over === item || over.parentElement !== list){ target = null; return; }
      var r = over.getBoundingClientRect();
      after = kind === 'card' && list.clientWidth > r.width * 1.5 ? ev.clientX > r.left + r.width / 2 : ev.clientY > r.top + r.height / 2;
      over.classList.add(after ? 'drop-after' : 'drop-before'); target = over;
    }
    function up(){
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      item.classList.remove('dragging'); clear(); S.pointerDown = false;
      if (target){
        var ids = Array.prototype.map.call(list.children, function(c){ return c.dataset.id; }).filter(function(id){ return id && id !== item.dataset.id; });
        ids.splice(ids.indexOf(target.dataset.id) + (after ? 1 : 0), 0, item.dataset.id);
        if (kind === 'card') applyOrder('programs', mergeOrder(boardPrograms(), ids));
        else { var t = D.tasks.get(item.dataset.id); if (t) applyOrder('tasks', mergeOrder(tasksOf(t.program_id), ids)); }
        announce('Moved');
      }
      invalidate('board', 'person');
    }
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

function showLogin(msg){
  $('#shell').hidden = true; $('#login').hidden = false;
  S.accent = '#2f6b4f'; applyTheme();
  document.title = 'Sign in \u00b7 Roots PA Tasks';
  var pick = $('#teamPick'), last = lsGet('pickTeam', null);
  if (!pick.children.length){
    PICKER.forEach(function(t){
      var id = 'tp_' + t.team;
      pick.append(h('label', {for: id, style: {'--tc': inkFor(t.accent)}},
        h('input', {type: 'radio', name: 'team', id: id, value: t.team, checked: last === t.team}),
        h('span', {class: 'tdot', 'aria-hidden': 'true'}), h('span', {text: t.team_name})));
    });
  }
  var e = $('#teamErr');
  if (msg){ e.textContent = msg; e.hidden = false; } else e.hidden = true;
}
function setBusy(btn, on, label){ btn.disabled = on; if (label) btn.textContent = on ? 'Signing in\u2026' : label; }
$$('.pwtoggle').forEach(function(b){
  b.addEventListener('click', function(){
    var inp = document.getElementById(b.getAttribute('aria-controls')), show = inp.type === 'password';
    inp.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; b.setAttribute('aria-pressed', show ? 'true' : 'false');
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

});
$('#adminToggle').addEventListener('click', function(){

  $('#adminToggle').textContent = showAdmin ? 'Sign in with a team password' : 'Admin sign in';

});
$('#teamForm').addEventListener('submit', async function(e){
  e.preventDefault();

  err.hidden = true;

$('#adminForm').addEventListener('submit', async function(e){

/* The address keeps the week being viewed. Reopening the app hours later from that same address
   (Safari reloading a tab, a home-screen launch) starts on the current week instead; a link someone
   shared, or a reload within a few minutes, still opens the week it names (review M3, P7). */
function bootRoute(){
  var r = parseHash(), last = lsGet('hashAt', null);
  var own = last && last.h === location.hash, stale = !last || Date.now() - (last.at || 0) > 30 * 60000;
  if (own && stale){ delete r.week; delete r.month; }
  return r;
}
async function afterSignIn(session, route){
  S.session = session; S.uid = session.user.id; S.email = session.user.email;
  route = route || {};
  var r;
  try { r = await sb.rpc('whoami'); } catch (x){ r = {error: x}; }
  var teams;
  if (r.error){
    teams = lsGet('teams:' + S.uid, null);
    if (!teams){ showLogin(authError(r.error, false)); return; }
  } else {
    teams = (r.data || []).map(function(t){ return {team: t.team, team_name: t.team_name || teamMeta(t.team).team_name, role: t.role, accent: t.accent || teamMeta(t.team).accent}; });
    var order = PICKER.map(function(p){ return p.team; });
    teams.sort(function(a, b){ var x = order.indexOf(a.team), y = order.indexOf(b.team); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y) || a.team.localeCompare(b.team); });
    lsSet('teams:' + S.uid, teams);
  }
  S.teams = teams;
  if (!teams.length){
    S.signingOut = true; await sb.auth.signOut({scope: 'local'}); S.signingOut = false;
    showLogin('This sign-in isn\u2019t on any team yet. Ask Anisha to add it.'); return;
  }
  var want = [route.team, lsGet('lastTeam:' + S.uid, null)].find(function(x){ return x && teams.some(function(t){ return t.team === x; }); }) || teams[0].team;
  var notice = route.team && route.team !== want ? route.team : null;
  await enterTeam(want, route.team === want ? route : {});
  if (notice) otherTeamNotice(notice);
}
function resetData(){
  Object.keys(D).forEach(function(k){ D[k] = new Map(); });
  IX = null;
  S.sharedLoaded = false; S.sharedError = null; S.weekLoaded = null; S.monthLoaded = null; S.weekError = null; S.monthError = null; S.monthLoading = null;
  S.hist = null; S.histErr = null; S.histMore = false; S.histNames = {tasks: {}, shifts: {}, programs: {}}; S.person = null; S.buffer = []; S.noteOpen = null; S.copying = false;
  poIds.clear(); S.tplOpen = new Set(); S.tplQuery = '';
  TABS.forEach(function(t){ var s = $('#v-' + t.id); if (s) s.replaceChildren(); });
}
async function enterTeam(team, route){
  route = route || {};
  if (S.team && S.team !== team){
    flushAllPend(); await drain(3000); saveQueue();
  }
  if (S.channel){ try { sb.removeChannel(S.channel); } catch (e){} S.channel = null; }
  var m = S.teams.find(function(t){ return t.team === team; });
  S.team = team; S.role = m.role; S.teamName = m.team_name; S.accent = m.accent || teamMeta(team).accent;
  lsSet('lastTeam:' + S.uid, team);
  resetData();
  Q.items = []; Q.paused = false; Q.failed = false; Q.backoff = 1000; Q.authTries = 0; loadQueue();
  S.week = route.week || thisWeek(); S.month = route.month || thisMonth();
  if (route.tab && tabOk(route.tab)) S.tab = route.tab; else if (!tabOk(S.tab)) S.tab = 'board';
  dayNow = todayIso();
  applyTheme();
  $('#login').hidden = true; $('#shell').hidden = false;
  buildTabs();
  writeHash(true);
  showTab(true); renderHeader();
  subscribe();
  var pShared = reloadShared();
  var pWeek = loadWeek();
  if (S.tab === 'shifts') startMonth();
  if (S.tab === 'history') loadHistory();
  await pShared; await pWeek;
  if (team !== S.team) return;
  if (Q.items.length) kick();
  invalidateAll();
  setTimeout(function(){ if (team === S.team && S.monthLoaded !== S.month && !S.monthLoading) startMonth().then(fillDatalists); }, 1200);
  var main = $('#main'); if (main && (!document.activeElement || document.activeElement === document.body || $('#login').contains(document.activeElement))) main.focus({preventScroll: true});
}
async function signOut(force){
  flushAllPend();
  if (!force && (Q.items.length || Pend.size)) await drain(4000);
  // never sign out over unsaved changes without saying so, including from the "sign in again" sheet (B10)
  if (!force && Q.items.length){
    var n = Q.items.length, why = Q.paused ? 'You were signed out, so ' + (n === 1 ? 'it' : 'they') + ' couldn\u2019t save.' : navigator.onLine ? 'Still trying to save.' : 'You\u2019re offline.';
    var ok = await confirmBox({title: n === 1 ? '1 change hasn\u2019t saved yet' : n + ' changes haven\u2019t saved yet', body: why + ' If you sign out now, ' + (n === 1 ? 'it stays' : 'they stay') + ' on this device and ' + (n === 1 ? 'saves' : 'save') + ' the next time ' + S.teamName + ' signs in here.', ok: 'Sign out anyway', cancel: Q.paused ? 'Go back' : 'Stay signed in', danger: true});
    if (!ok){ if (Q.paused){ S.reauthOpen = false; promptReauth(); } return; }
  }
  saveQueue();
  S.signingOut = true;
  if (S.channel){ try { sb.removeChannel(S.channel); } catch (e){} S.channel = null; }
  try { await sb.auth.signOut({scope: 'local'}); } catch (e){}
  S.session = null; S.team = null; S.teams = []; S.uid = null; S.email = null; S.role = null;
  Q.items = []; Q.paused = false; Q.failed = false;
  closeSheet();
  resetData();
  history.replaceState(null, '', location.pathname + location.search);
  S.signingOut = false;
  showLogin();
  announce('Signed out');
  var pw = $('#teamForm').hidden ? $('#adminEmail') : $('#teamPw'); if (pw) pw.focus();
}

/* render errors never leave a blank screen */
Object.keys(RENDER).forEach(function(k){

(async function boot(){
