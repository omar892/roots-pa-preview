/* Arial sized to Inter's metrics (Roots v3 fonts.css), so text doesn't move while Inter loads. */
@font-face{
  font-family:'Inter Fallback';
  src:local('Arial'),local('ArialMT');
  ascent-override:90.44%;
  descent-override:22.52%;
  line-gap-override:0%;
  size-adjust:107.12%;
}
:root{
  /* ---- Roots Design System v3, light theme ---- */
  --roots-green:#202f0e;
  --roots-forest:#1e291c;
  --roots-herb:#2e4a0d;
  --roots-sage:#88a596;
  --roots-tea:#b0c597;
  --roots-white:#f5f1e8;
  --text-primary:#202020;
  --text-secondary:#6e6e6e;
  --white:#ffffff;
  --header-glass:rgba(30,41,28,.94);
  --surface:var(--roots-white);
  --surface-raised:var(--white);
  --surface-tint:var(--roots-white);
  --surface-inverse:var(--roots-green);
  --ink:var(--text-primary);
  --ink-muted:var(--text-secondary);
  --heading:var(--roots-green);
  --ink-inverse:var(--roots-white);
  --accent:var(--roots-herb);
  --line:rgba(32,47,14,.16);
  --line-strong:var(--text-secondary);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 var(--font);

  border-radius:var(--r-s);min-height:var(--tap);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;

  <div class="login-card">
    <h1 id="loginTitle">Roots DFW <span>Hub</span></h1>
    <form id="signinForm" novalidate>
      <label class="field" for="signinUser">Username or email</label>
      <input type="text" id="signinUser" name="username" autocomplete="username" required inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
      <label class="field gap" for="signinPw">Password</label>
      <div class="pwrow">
        <input type="password" id="signinPw" name="password" autocomplete="current-password" required enterkeyhint="go">
        <button type="button" class="pwtoggle" id="pwToggle" aria-controls="signinPw" aria-pressed="false" aria-label="Show password">Show</button>
      </div>
      <p id="signinErr" class="err" role="alert" hidden></p>
      <button type="submit" class="primary" id="signinSubmit">Sign in</button>
    </form>
  </div>
</main>

<div id="shell" hidden>
  <header class="hdr" id="hdr">
    <h1 class="sr-only" id="appTitle">Roots Hub</h1>
    <div class="hdr1">
      <div id="teamSlot" class="teamslot"></div>
      <form class="hsearch" id="searchForm" role="search" action="#" novalidate>
        <label class="sr-only" for="q">Search the hub</label>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg>
        <input type="search" id="q" name="q" placeholder="Search" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </form>
      <button type="button" class="hdr-add" id="addBtn"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Add a link</button>
      <button type="button" class="icon" id="acctBtn" aria-label="Account" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="btabs" id="btabs" aria-label="Sections"></nav>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
<div id="toasts" aria-live="polite" aria-relevant="additions"></div>

var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1c3Z5cWNmZXdoZ3dleGhwYWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMTA1NjQsImV4cCI6MjEwNzU4NjU2NH0.PnLN8iAcVTiq5QvCCYK9mnUMnLsql-E7gkfgd83WL2I';

var Data = (function(){
  var sb = null;

    HUB_FORBIDDEN: 'You don\u2019t have access to do that.',

  function client(){
    if (sb) return sb;
    if (!window.supabase) throw mkErr('network', 'Can\u2019t load the page. Check your connection and reload.');
    sb = window.supabase.createClient(SB_URL, SB_ANON, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'rootshub-auth'}});
    return sb;
  }
  function mkErr(hint, message, status){ var e = new Error(message || 'Something went wrong. Try again.'); e.hint = hint || ''; e.status = status || 0; return e; }

    var msg = String(error && error.message || '');
    var m = /HUB_[A-Z_]+/.exec(msg);
    if (m) return mkErr(m[0], CODE_MSG[m[0]] || 'Something went wrong. Try again.', status);
    if (/23505|duplicate key|unique constraint/i.test(msg) || error && error.code === '23505') return mkErr('HUB_DUPLICATE', CODE_MSG.HUB_DUPLICATE, status);
    if (/failed to fetch|networkerror|load failed|network request failed|fetch/i.test(msg)) return mkErr('network', 'Can\u2019t reach the server. Check your connection and try again.', 0);
    if (status === 401 || /jwt|not authenticated|invalid claim/i.test(msg)) return mkErr('auth', 'Please sign in again.', 401);
    return mkErr('', 'Something went wrong. Try again.', status);
  }
  async function rpc(name, args){
    var clean = {};
    Object.keys(args || {}).forEach(function(k){ if (args[k] !== undefined) clean[k] = args[k]; });
    var r;
    try { r = await client().rpc(name, clean); } catch (x){ throw fromPg(x, 0); }
    if (r.error) throw fromPg(r.error, r.status);

  }
  return {
    mode: 'live',
    async getSession(){ var r = await client().auth.getSession(); return r.data && r.data.session || null; },
    async signIn(email, password){
      var r;
      try { r = await client().auth.signInWithPassword({email: email, password: password}); } catch (x){ throw fromPg(x, 0); }
      if (r.error){
        var bad = r.error.status === 400 || /invalid login|credentials/i.test(r.error.message || '');
        throw bad ? mkErr('bad_login', 'That username or password didn\u2019t work.', 400) : fromPg(r.error, r.error.status);
      }

    },
    async signOut(){
      /* A shared computer must be signed out even if the server call never finishes: drop the stored session first, then tell the server. */
      try { localStorage.removeItem('rootshub-auth'); localStorage.removeItem('rootshub-auth-code-verifier'); } catch (x){}
      try { await client().auth.signOut({scope: 'local'}); } catch (x){}
      try { client().removeAllChannels(); } catch (x){}
    },
    whoami: function(){ return rpc('hub_whoami'); },
    async list(space){
      var r;
      try { r = await client().from('hub_artifacts').select('*').eq('space', space); } catch (x){ throw fromPg(x, 0); }
      if (r.error) throw fromPg(r.error, r.status);
      return r.data || [];
    },
    submit: function(a){ return rpc('hub_submit', {p_space: a.space, p_url: a.url, p_title: a.title, p_summary: a.summary || null, p_collection: a.collection || null, p_tags: a.tags, p_owner: a.owner || null, p_note: a.note || null, p_publish: !!a.publish}); },
    update: function(id, fields){ return rpc('hub_update', {p_id: id, p_fields: fields}); },
    publish: function(id, live){ return rpc('hub_publish', {p_id: id, p_live: live !== false}); },
    feature: function(id, on, rank){ return rpc('hub_feature', {p_id: id, p_on: !!on, p_rank: rank}); },
    featureOrder: function(space, ids){ return rpc('hub_feature_order', {p_space: space, p_ids: ids}); },
    remove: function(id){ return rpc('hub_remove', {p_id: id}); },
    restore: function(id){ return rpc('hub_restore', {p_id: id}); },
    removed: function(space){ return rpc('hub_removed', {p_space: space}); },
    open: function(id){ try { rpc('hub_open', {p_id: id}).catch(function(){}); } catch (x){} },
    subscribe: function(space, cb){
      var ch = null;
      try {
        ch = client().channel('hub-' + space).on('postgres_changes', {event: '*', schema: 'public', table: 'hub_artifacts', filter: 'space=eq.' + space}, cb).subscribe();
      } catch (x){}
      return function(){ try { if (ch) client().removeChannel(ch); } catch (x){} };
    }
  };
})();

function $(s, r){ return (r || document).querySelector(s); }

/* ---------- dates and text ---------- */
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function ctIso(d){ return new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(d); }
function dayNum(iso){ var p = iso.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function relDate(ts){
  var d = new Date(ts); if (isNaN(d.getTime())) return '';
  var n = dayNum(ctIso(new Date())) - dayNum(ctIso(d));
  if (n <= 0) return 'today';
  if (n === 1) return 'yesterday';
  if (n < 14) return n + ' days ago';
  if (n < 60) return Math.floor(n / 7) + ' weeks ago';
  var p = ctIso(d).split('-');
  return MON[+p[1] - 1] + ' ' + (+p[2]) + (p[0] !== ctIso(new Date()).slice(0, 4) ? ', ' + p[0] : '');
}
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function lsGet(k, d){ try { var v = localStorage.getItem('rootshub:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } }

/* ---------- toast (optional action button, e.g. Undo) ---------- */
function toast(msg, o){
  o = o || {};
  var dlg = $('#sheet'), host;
  if (dlg.open){
    host = $('#sheetToasts', dlg);
    if (!host){ host = h('div', {id: 'sheetToasts', role: 'status', 'aria-live': 'polite'}); dlg.appendChild(host); }
  } else host = $('#toasts');
  var t = h('div', {class: 'toast' + (o.err ? ' error' : '')}, h('span', {text: msg}));
  if (o.action) t.appendChild(h('button', {type: 'button', on: {click: function(){ t.remove(); o.action.fn(); }}}, o.action.label));
  host.appendChild(t);
  while (host.children.length > 3) host.firstChild.remove();
  setTimeout(function(){ t.remove(); }, o.ms || (o.err ? 6500 : 3800));
  return t;
}

/* ---------- sheet ---------- */
var sheetOpener = null, sheetOnClose = null;
function openSheet(o){
  var d = $('#sheet');
  if (!d.open) sheetOpener = document.activeElement;
  d.className = 'sheet' + (o.wide ? ' wide' : '');
  d.replaceChildren();
  var title = h('h2', {id: 'sheetTitle', tabindex: '-1', text: o.title});
  var head = h('div', {class: 'sh-head'}, title, h('button', {type: 'button', class: 'icon', 'aria-label': 'Close', on: {click: closeSheet}}, icon('x')));
  var body = h('div', {class: 'sh-body'}, o.body), foot = h('div', {class: 'sh-foot'}, o.foot);
  d.appendChild(head); d.appendChild(body); d.appendChild(foot);
  sheetOnClose = o.onClose || null;
  if (!d.open) d.showModal();
  var first = o.focusTitle ? title : ($('input:not([type=hidden]),select,textarea', body) || $('button', body) || title);
  first.focus({preventScroll: true});
  body.scrollTop = 0;
  return d;
}
function closeSheet(){ var d = $('#sheet'); if (d.open) d.close(); }
$('#sheet').addEventListener('close', function(){
  if ($('#sheet').open) return;   /* a new sheet replaced this one in the same tick: keep its opener */
  var cb = sheetOnClose; sheetOnClose = null;
  var t = $('#sheetToasts', $('#sheet')); if (t) t.remove();
  if (sheetOpener && document.contains(sheetOpener) && !sheetOpener.disabled){ try { sheetOpener.focus({preventScroll: true}); } catch (e){} }

});
$('#sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });

/* ---------- sign-in ---------- */
function loginEmail(v){
  var email = String(v || '').trim();
  if (email.indexOf('@') < 0 && /^[a-z0-9._-]+$/i.test(email)) email = email.toLowerCase() + '@' + DOMAIN;
  return email;
}
function showLogin(msg){
  $('#shell').hidden = true; $('#login').hidden = false;
  document.title = 'Sign in \u00b7 Roots Hub';
  var e = $('#signinErr'); if (msg){ e.textContent = msg; e.hidden = false; } else e.hidden = true;
  document.documentElement.classList.add('booted');

function toLogin(msg){
  S.session = null; S.rows = null; S.role = ''; S.q = ''; S.coll = 'all'; S.tok++;
  if (S.unsub){ try { S.unsub(); } catch (x){} S.unsub = null; }
  clearTimeout(S.timer);
  closeSheet(); Data.signOut();
  $('#signinPw').value = ''; $('#q').value = '';

}

$('#signinForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var err = $('#signinErr'), um = $('#signinUser'), pw = $('#signinPw'), btn = $('#signinSubmit');
  err.hidden = true;
  if (!um.value.trim()){ err.textContent = 'Type your username or email.'; err.hidden = false; um.focus(); return; }
  var email = loginEmail(um.value);
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent = 'Type your username, or your full email.'; err.hidden = false; um.focus(); return; }
  if (!pw.value){ err.textContent = 'Type your password.'; err.hidden = false; pw.focus(); return; }
  btn.disabled = true; btn.textContent = 'Signing in\u2026';
  try {
    var session = await Data.signIn(email, pw.value);
    pw.value = '';
    await afterSignIn(session);

    err.textContent = x.message || 'Something went wrong. Try again.'; err.hidden = false; if (x.hint === 'bad_login') pw.select();

});
async function afterSignIn(session){

async function boot(){
  if (!window.supabase && Data.mode === 'live'){ showLogin('Can\u2019t load the page. Check your connection and reload.'); return; }
  try {
    var s = await Data.getSession();
    if (s){ await afterSignIn(s); return; }
  } catch (x){ showLogin(x && (x.hint === 'network' || x.hint === 'noaccess') ? x.message : ''); return; }

var SORTS = [['opens', 'Most opened'], ['new', 'Newest'], ['az', 'A-Z']];

function liveRows(){ return (S.rows || []).filter(function(r){ return r.status === 'live'; }); }
function draftRows(){ return (S.rows || []).filter(function(r){ return r.status === 'draft' && (canCurate() || r.submitted_by === S.uid); }); }
function byRank(a, b){ var x = a.feature_rank == null ? 1e9 : a.feature_rank, y = b.feature_rank == null ? 1e9 : b.feature_rank; return x - y || String(a.title).localeCompare(String(b.title)); }
function featuredRows(){ return liveRows().filter(function(r){ return r.featured; }).sort(byRank).slice(0, 6); }
function collectionCounts(){
  var m = {}; liveRows().forEach(function(r){ if (r.collection) m[r.collection] = (m[r.collection] || 0) + 1; });
  return Object.keys(m).sort(function(a, b){ return a.localeCompare(b); }).map(function(k){ return {name: k, n: m[k]}; });
}
function hay(r){ return [r.title, r.summary, (r.tags || []).join(' '), r.collection, r.owner_name].join(' ').toLowerCase(); }
function visibleItems(){
  var q = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var list = liveRows().filter(function(r){ return (S.coll === 'all' || r.collection === S.coll) && q.every(function(t){ return hay(r).indexOf(t) >= 0; }); });
  var by = {
    opens: function(a, b){ return (b.opens || 0) - (a.opens || 0) || String(a.title).localeCompare(String(b.title)); },
    'new': function(a, b){ var x = a.approved_at || a.created_at, y = b.approved_at || b.created_at; return x < y ? 1 : x > y ? -1 : 0; },
    az: function(a, b){ return String(a.title).toLowerCase().localeCompare(String(b.title).toLowerCase()); }
  };
  return list.sort(by[S.sort] || by.opens);
}
/* hub_open bumps updated_at through the touch trigger, so a row that was only opened would read "Updated today".
   When updated_at is within a second of last_opened_at the last change was an open: fall back to the approval/creation time. */
function shownDate(r){
  if (r.last_opened_at && r.updated_at && Math.abs(new Date(r.updated_at) - new Date(r.last_opened_at)) < 2000) return r.approved_at || r.created_at || r.updated_at;
  return r.updated_at || r.created_at;
}

function startHome(){
  var m = $('#main');
  m.replaceChildren(h('div', {id: 'strip'}), h('div', {id: 'shelf'}), h('div', {id: 'controls'}), h('div', {id: 'results'}, skel(3)), h('div', {id: 'foot'}));
  S.rows = null;
  refresh(true);
  if (S.unsub){ try { S.unsub(); } catch (x){} }
  S.unsub = Data.subscribe(SPACE, function(p){
    if (p && openOnly(p.new)) return;   /* someone else opened a card: nothing visible changed, skip the refetch */
    clearTimeout(S.timer); S.timer = setTimeout(function(){ if (S.session) refresh(); }, 400);
  });
}
var SAME_KEYS = ['title', 'summary', 'url', 'kind', 'collection', 'owner_name', 'status', 'featured', 'feature_rank', 'thumb_url', 'deleted_at', 'approved_at', 'submit_note'];
function openOnly(n){
  var row = n && (S.rows || []).filter(function(x){ return x.id === n.id; })[0];
  if (!row || !SAME_KEYS.every(function(k){ return String(row[k] == null ? '' : row[k]) === String(n[k] == null ? '' : n[k]); }) || JSON.stringify(row.tags || []) !== JSON.stringify(n.tags || [])) return false;
  row.opens = n.opens; row.last_opened_at = n.last_opened_at; row.updated_at = n.updated_at;
  return true;
}
async function refresh(first){
  var tok = ++S.tok;
  try {
    var rows = await Data.list(SPACE);
    if (tok !== S.tok || !S.session) return;
    S.rows = rows || []; S.loadedAt = Date.now();
    if (S.coll !== 'all' && !collectionCounts().some(function(c){ return c.name === S.coll; })) S.coll = 'all';
    renderAll();
  } catch (e){
    if (tok !== S.tok) return;
    if (first || !S.rows) loadErr(e, function(){ startHome(); });
    else if (e && e.hint === 'auth') toLogin('Please sign in again.');
  }
}
function renderAll(){ renderStrip(); renderShelf(); renderControls(); renderGrid(); renderFoot(); }

/* ---------- cards ---------- */
function safeHref(u){ return /^https:\/\//i.test(String(u || '')) ? u : '#'; }
function kindBadge(kind){
  var k = KIND[kind] || KIND.link;
  return h('span', {class: 'kind'}, icon(k.icon, 'sm'), h('span', {text: k.label}));
}
function card(r, big){
  var kind = KIND[r.kind] ? r.kind : 'link';
  var top;
  if (r.thumb_url){
    var img = h('img', {src: r.thumb_url, alt: '', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer'});
    top = h('div', {class: 'art-thumb'}, img);
    img.addEventListener('error', function(){ var li = img.closest('li'); if (li) li.replaceWith(card(Object.assign({}, r, {thumb_url: null}), big)); });
  } else top = h('div', {class: 'art-band k-' + kind, 'aria-hidden': 'true'}, icon((KIND[kind] || KIND.link).icon));
  var line = [r.collection, r.owner_name].filter(Boolean).join(' \u00b7 ');
  var a = h('a', {class: 'art-link', href: safeHref(r.url), target: '_blank', rel: 'noopener noreferrer', 'data-open': r.id},
    top,
    h('div', {class: 'art-body'},
      h('span', {class: 'kindrow k-' + kind}, kindBadge(kind)),
      h('h3', {text: r.title}),
      r.summary ? h('p', {class: 'art-sum', text: r.summary}) : null,
      line ? h('p', {class: 'meta art-line', text: line}) : null,
      h('p', {class: 'meta art-upd', text: 'Updated ' + relDate(shownDate(r))})),
    h('span', {class: 'sr-only', text: 'Opens in a new tab'}));
  var li = h('li', {class: 'art card' + (big ? ' big' : ''), 'data-id': r.id}, a);
  if (canCurate()) li.appendChild(h('button', {type: 'button', class: 'icon art-menu', 'aria-label': 'More actions for ' + r.title, 'aria-haspopup': 'dialog', on: {click: function(){ menuSheet(r); }}}, icon('more', 'dots')));
  return li;
}
function countOpen(id){
  if (!id) return;
  Data.open(id);
  var r = (S.rows || []).filter(function(x){ return x.id === id; })[0]; if (r) r.opens = (r.opens || 0) + 1;
}
document.addEventListener('click', function(e){ var a = e.target.closest && e.target.closest('a[data-open]'); if (a) countOpen(a.getAttribute('data-open')); }, true);
document.addEventListener('auxclick', function(e){ if (e.button !== 1) return; var a = e.target.closest && e.target.closest('a[data-open]'); if (a) countOpen(a.getAttribute('data-open')); }, true);

/* ---------- shelf ---------- */
function renderShelf(){
  var box = $('#shelf'); box.replaceChildren();
  var f = featuredRows();
  if (!f.length || S.q.trim() || S.coll !== 'all') return;
  var ul = h('ul', {class: 'shelf'});
  f.forEach(function(r){ ul.appendChild(card(r, true)); });
  box.appendChild(h('section', {class: 'shelf-sec', 'aria-labelledby': 'shelfH'}, h('h2', {class: 'sec-h', id: 'shelfH', text: 'Featured'}), ul));
}

/* ---------- chips + sort ---------- */
function renderControls(){
  var box = $('#controls');
  /* keyboard users keep their place: re-focus the same chip or sort button after the row is rebuilt */
  var ae = document.activeElement, keep = ae && box.contains(ae) ? (ae.hasAttribute('data-coll') ? ['data-coll', ae.getAttribute('data-coll')] : ae.hasAttribute('data-sort') ? ['data-sort', ae.getAttribute('data-sort')] : null) : null;
  box.replaceChildren();
  if (!liveRows().length) return;
  var cc = collectionCounts();
  var chips = h('div', {class: 'chips', role: 'group', 'aria-label': 'Collections'});
  chips.appendChild(h('button', {type: 'button', 'data-coll': 'all', 'aria-pressed': S.coll === 'all' ? 'true' : 'false', on: {click: function(){ setColl('all'); }}}, 'All ', h('span', {class: 'n', text: String(liveRows().length)})));
  cc.forEach(function(c){
    chips.appendChild(h('button', {type: 'button', 'data-coll': c.name, 'aria-pressed': S.coll === c.name ? 'true' : 'false', on: {click: function(){ setColl(c.name); }}}, c.name + ' ', h('span', {class: 'n', text: String(c.n)})));
  });
  var seg = h('div', {class: 'seg', role: 'group', 'aria-label': 'Sort'});
  SORTS.forEach(function(s){
    seg.appendChild(h('button', {type: 'button', 'data-sort': s[0], 'aria-pressed': S.sort === s[0] ? 'true' : 'false', on: {click: function(){ S.sort = s[0]; lsSet('sort', s[0]); renderControls(); renderGrid(); }}}, s[1]));
  });
  box.appendChild(h('div', {class: 'controls'}, chips, seg));
  if (keep){ var again = $('#controls [' + keep[0] + '="' + String(keep[1]).replace(/"/g, '\\"') + '"]'); if (again) again.focus({preventScroll: true}); }
}
function setColl(name){ S.coll = name; renderShelf(); renderControls(); renderGrid(); }

/* ---------- grid ---------- */
function clearSearch(){ S.q = ''; $('#q').value = ''; renderShelf(); renderGrid(); $('#q').focus(); }
function renderGrid(){
  var box = $('#results'); box.replaceChildren();
  if (S.rows == null){ box.appendChild(skel(3)); return; }
  if (!liveRows().length){
    box.appendChild(emptyCard('Nothing here yet', '', h('button', {type: 'button', class: 'primary', id: 'emptyAdd', on: {click: function(){ addSheet(); }}}, 'Add a link')));
    return;
  }
  var items = visibleItems();
  var status = h('p', {class: 'sr-only', role: 'status', id: 'resCount', text: S.q.trim() ? plural(items.length, 'result') : plural(items.length, 'item')});
  if (!items.length){
    box.appendChild(status);
    box.appendChild(emptyCard(S.q.trim() ? 'No matches' : 'Nothing here yet', '', S.q.trim() ? h('button', {type: 'button', class: 'primary', id: 'clearSearch', on: {click: clearSearch}}, 'Clear search') : null));
    return;
  }
  var ul = h('ul', {class: 'grid', id: 'grid'});
  items.forEach(function(r){ ul.appendChild(card(r, false)); });
  box.appendChild(h('h2', {class: 'sr-only', text: 'All items'}));
  box.appendChild(status);
  box.appendChild(ul);
}

/* ---------- search ---------- */
var annTimer = null;
$('#q').addEventListener('input', function(){

  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey || !S.session || $('#sheet').open) return;

/* ---------- jump to a card (duplicate link, new item) ---------- */
function focusItem(id){
  var r = (S.rows || []).filter(function(x){ return x.id === id; })[0];
  if (r && r.status === 'live' && (S.q.trim() || (S.coll !== 'all' && r.collection !== S.coll))){ S.q = ''; $('#q').value = ''; S.coll = 'all'; renderShelf(); renderControls(); renderGrid(); }
  var el = $('#results li.art[data-id="' + id + '"]') || $('#strip [data-id="' + id + '"]');
  if (!el) return;
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({block: 'center', behavior: calm ? 'auto' : 'smooth'});
  el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 2000);
}

/* ==========================================================================
   Add, strips (waiting for approval / your suggestions), curator actions: menu, edit, feature, remove + undo, recently removed.
   ========================================================================== */
var DEFAULT_COLLS = ['Admin', 'Development', 'Operations', 'Programs', 'Training', 'Volunteers'];

/* ---------- helpers ---------- */
function normUrl(v){
  v = String(v || '').trim();
  if (!v) return '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+(\/|$|\?|#)/.test(v)) return 'https://' + v;
  return v;
}
function validUrl(u){ return /^https:\/\/[^\s\/]+\.[^\s\/]+\S*$/i.test(u); }
function sameUrl(a, b){ return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase(); }
function findByUrl(u){ return (S.rows || []).filter(function(r){ return sameUrl(r.url, u); })[0] || null; }
/* Prefill for the title field: a readable path segment ("fall-fest-run-of-show"), never an opaque id. */
function guessTitle(u){
  var p; try { p = new URL(u); } catch (e){ return ''; }
  var segs = p.pathname.split('/').filter(Boolean).map(function(s){ try { return decodeURIComponent(s); } catch (e){ return s; } });
  var skip = /^(edit|view|preview|public|artifacts?|d|document|spreadsheets|presentation|design|share|pub|publish|p|chat|projects?|u|embed|htmlview|copy|r|s|www|\d)$/i;
  for (var i = segs.length - 1; i >= 0; i--){
    var s = segs[i].replace(/\.[a-z0-9]{2,4}$/i, '').replace(/[-_ ]?[0-9a-f]{32}$/i, '');
    if (!s || skip.test(s)) continue;
    if (/^[0-9a-f-]{20,}$/i.test(s)) continue;
    if (/^[A-Za-z0-9_-]{20,}$/.test(s) && !/[-_]/.test(s)) continue;
    var words = s.split(/[-_+\s]+/).filter(Boolean);
    if (!words.length) continue;
    if (words.length === 1 && (/\d/.test(words[0]) || words[0].length < 4)) continue;
    var t = words.join(' ').toLowerCase();
    return t.charAt(0).toUpperCase() + t.slice(1, 120);
  }
  return '';
}
function collNames(extra){
  var m = {}; DEFAULT_COLLS.forEach(function(c){ m[c] = 1; });
  (S.rows || []).forEach(function(r){ if (r.collection) m[r.collection] = 1; });
  if (extra) m[extra] = 1;
  return Object.keys(m).sort(function(a, b){ return a.localeCompare(b); });
}
/* collection <select> with an "Other" option that reveals a text field */
function collField(id, initial){
  var sel = h('select', {id: id}), other = h('input', {type: 'text', id: id + 'Other', maxlength: '40', autocomplete: 'off', hidden: true});
  var lab = h('label', {class: 'field', for: id + 'Other', hidden: true, text: 'Collection name'});
  sel.appendChild(h('option', {value: '', text: 'No collection'}));
  collNames(initial).forEach(function(c){ sel.appendChild(h('option', {value: c, text: c, selected: c === initial})); });
  sel.appendChild(h('option', {value: '__other', text: 'Other'}));
  sel.addEventListener('change', function(){ var o = sel.value === '__other'; other.hidden = !o; lab.hidden = !o; if (o) other.focus(); });
  return {sel: sel, node: h('div', null, h('label', {class: 'field', for: id, text: 'Collection (optional)'}), sel, h('div', {class: 'sub-field'}, lab, other)),
    value: function(){ return sel.value === '__other' ? other.value.trim() : sel.value; }};
}
function field(id, label, input, hint){ return h('div', null, h('label', {class: 'field', for: id, text: label}), input, hint || null); }
function txt(id, o){ return h('input', Object.assign({type: 'text', id: id, autocomplete: 'off'}, o || {})); }

/* ---------- add ---------- */
function addSheet(){
  var cur = canCurate();
  var url = h('input', {type: 'url', id: 'adUrl', inputmode: 'url', autocomplete: 'off', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', placeholder: 'https://', required: true, 'aria-describedby': 'adErr'});
  var title = txt('adTitle', {maxlength: '120', required: true, 'aria-describedby': 'adErr'});
  var summary = txt('adSummary', {maxlength: '280'});
  var coll = collField('adColl', S.coll !== 'all' ? S.coll : '');
  var pub = h('input', {type: 'checkbox', id: 'adPub', checked: true});
  var err = h('p', {class: 'err', role: 'alert', hidden: true, id: 'adErr'});
  var go = h('button', {type: 'submit', class: 'primary', id: 'adGo', form: 'adForm', text: cur ? 'Add' : 'Send for approval'});
  var dirty = false;
  title.addEventListener('input', function(){ dirty = true; });
  function prefill(){ if (!dirty){ title.value = guessTitle(normUrl(url.value)); } }
  url.addEventListener('input', prefill); url.addEventListener('change', prefill);
  url.addEventListener('paste', function(){ setTimeout(prefill, 0); });
  if (cur) pub.addEventListener('change', function(){ go.textContent = pub.checked ? 'Add' : 'Save for later'; });
  function fail(msg, el){ err.textContent = msg; err.hidden = false; if (el) el.focus(); }
  var form = h('form', {id: 'adForm', class: 'stack', novalidate: true, on: {submit: async function(ev){
    ev.preventDefault(); if (S.busy) return;
    err.hidden = true;
    var u = normUrl(url.value), t = title.value.trim();
    if (!u) return fail('Paste a link to add.', url);
    if (!validUrl(u)) return fail('Paste a full link that starts with https://', url);
    if (!t) return fail('Add a title.', title);
    var dup = findByUrl(u);
    if (dup && dup.status === 'draft' && cur && pub.checked){ closeSheet(); approve(dup).then(function(){ focusItem(dup.id); }); return; }   /* a curator adding a link that is already waiting just approves it */
    if (dup){ closeSheet(); toast(dup.status === 'live' ? 'Already in the hub' : 'Already waiting for approval'); focusItem(dup.id); return; }
    S.busy = true; go.disabled = true; var label = go.textContent; go.textContent = 'Adding\u2026';
    try {
      var known = (S.rows || []).map(function(r){ return r.id; });
      var publish = cur && pub.checked;
      var id = await Data.submit({space: SPACE, url: u, title: t, summary: summary.value.trim(), collection: coll.value(), publish: publish});
      closeSheet();
      if (known.indexOf(id) >= 0){ await refresh(); toast('Already in the hub'); focusItem(id); }
      else { await refresh(); toast(!cur ? 'Sent for approval' : publish ? 'Added to the hub' : 'Saved. Waiting for approval'); if (publish) focusItem(id); }
    } catch (e){
      go.disabled = false; go.textContent = label;
      if (e && e.hint === 'auth'){ failToast(e); } else fail(e.message || 'Something went wrong. Try again.', e.hint === 'HUB_BAD_URL' ? url : e.hint === 'HUB_TITLE_REQUIRED' ? title : null);
    } finally { S.busy = false; }
  }}},
    field('adUrl', 'Paste a link', url), field('adTitle', 'Title', title), field('adSummary', 'Summary (optional)', summary), coll.node,
    cur ? h('label', {class: 'chk', for: 'adPub'}, pub, h('span', {text: 'Publish now'})) : null, err);
  openSheet({title: 'Add a link', body: [form], foot: [go]});
}

/* ---------- strip: waiting for approval (curator) / your suggestions (viewer) ---------- */
function renderStrip(){
  var box = $('#strip'); box.replaceChildren();
  var d = draftRows().sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; });
  if (!d.length) return;
  var cur = canCurate();
  var ul = h('ul', {class: 'rows dr-list'});
  d.forEach(function(r){
    var main = h('div', {class: 'dr-main'}, h('b', {text: r.title}),
      h('a', {class: 'ext', href: safeHref(r.url), target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Open ' + r.title + ' in a new tab'}, h('span', {text: hostOf(r.url)}), icon('ext', 'sm')),
      cur && r.submit_note ? h('span', {class: 'meta', text: r.submit_note}) : null,
      cur ? null : h('span', {class: 'tag need', text: 'Waiting for approval'}));
    var acts = cur
      ? h('div', {class: 'acts'}, h('button', {type: 'button', class: 'primary', 'data-approve': r.id, 'aria-label': 'Approve ' + r.title, on: {click: function(){ approve(r); }}}, 'Approve'),
          h('button', {type: 'button', 'data-remove': r.id, 'aria-label': 'Remove ' + r.title, on: {click: function(){ removeRow(r); }}}, 'Remove'))
      : h('div', {class: 'acts'}, h('button', {type: 'button', 'data-withdraw': r.id, 'aria-label': 'Withdraw ' + r.title, on: {click: function(){ removeRow(r); }}}, 'Withdraw'));
    ul.appendChild(h('li', {class: 'dr', 'data-id': r.id}, main, acts));
  });
  box.appendChild(h('section', {class: 'strip-sec', 'aria-labelledby': 'stripH'}, h('h2', {class: 'sec-h', id: 'stripH', text: cur ? 'Waiting for approval' : 'Your suggestions'}), ul));
}
function renderFoot(){
  var box = $('#foot'); box.replaceChildren();
  if (canCurate()) box.appendChild(h('div', {class: 'foot-links'}, h('button', {type: 'button', class: 'link', id: 'removedLink', on: {click: removedSheet}}, 'Recently removed')));
}

/* ---------- actions ---------- */
/* A realtime refetch replaces every row object, so a button or menu built before it holds a stale copy: always act on the current row with the same id. */
function cur_(r){ return (S.rows || []).filter(function(x){ return x.id === r.id; })[0] || r; }
async function approve(r){
  r = cur_(r);
  if (S.busy) return;
  var prev = r.status; r.status = 'live'; r.approved_at = new Date().toISOString(); renderAll();
  try { await Data.publish(r.id, true); toast('Published \u201c' + shortText(r.title, 40) + '\u201d'); refresh(); }
  catch (e){ r.status = prev; renderAll(); failToast(e); }
}
async function removeRow(r){
  r = cur_(r);
  var snap = {id: r.id, title: r.title, featured: r.featured, feature_rank: r.feature_rank, status: r.status};
  var idx = (S.rows || []).indexOf(r); if (idx < 0) return;
  S.rows.splice(idx, 1); renderAll();
  try { await Data.remove(r.id); }
  catch (e){ S.rows.splice(idx, 0, r); renderAll(); failToast(e); return; }
  if (canCurate()) toast('Removed \u201c' + shortText(r.title, 40) + '\u201d', {ms: 8000, action: {label: 'Undo', fn: function(){ undoRemove(snap); }}});
  else toast('Withdrawn');
  refresh();
}
async function undoRemove(r){
  try {
    await Data.restore(r.id);
    /* hub_remove clears the shelf spot; put a featured card back where it was (best effort: the shelf may have filled meanwhile) */
    if (r.featured && r.status === 'live'){ try { await Data.feature(r.id, true, r.feature_rank); } catch (x){} }
    await refresh(); toast('Restored'); focusItem(r.id);
  }
  catch (e){ failToast(e); }
}
async function setFeatured(r, on){
  try { await Data.feature(r.id, on); await refresh(); toast(on ? 'Added to the shelf' : 'Taken off the shelf'); }
  catch (e){ failToast(e); }
}
async function moveFeatured(r, dir){
  r = cur_(r);
  var f = liveRows().filter(function(x){ return x.featured; }).sort(byRank), i = f.indexOf(r), j = i + dir;
  if (i < 0 || j < 0 || j >= f.length) return;
  var t = f[i]; f[i] = f[j]; f[j] = t;
  f.forEach(function(x, k){ x.feature_rank = k + 1; }); renderShelf();
  try { await Data.featureOrder(SPACE, f.map(function(x){ return x.id; })); toast('Moved ' + (dir < 0 ? 'left' : 'right')); refresh(); }
  catch (e){ failToast(e); refresh(); }
}
async function sendBack(r){
  try { await Data.publish(r.id, false); await refresh(); toast('Sent back to waiting for approval'); }
  catch (e){ failToast(e); }
}

/* ---------- card menu (curator) ---------- */
function menuSheet(r){
  var items = [];
  if (r.status === 'live'){
    items.push([r.featured ? 'Unfeature' : 'Feature', function(){ setFeatured(r, !r.featured); }]);
    if (r.featured){
      var f = featuredRows(), i = f.map(function(x){ return x.id; }).indexOf(r.id);
      if (i > 0) items.push(['Move left', function(){ moveFeatured(r, -1); }]);
      if (i >= 0 && i < f.length - 1) items.push(['Move right', function(){ moveFeatured(r, 1); }]);
    }
  }
  items.push(['Edit', function(){ editSheet(r); }]);
  if (r.status === 'live') items.push(['Send back to draft', function(){ sendBack(r); }]);
  items.push(['Remove', function(){ removeRow(r); }, true]);
  var ul = h('ul', {class: 'opts'});
  items.forEach(function(it){
    ul.appendChild(h('li', null, h('button', {type: 'button', class: it[2] ? 'warn' : null, on: {click: function(){ if (it[0] !== 'Edit') closeSheet(); it[1](); }}}, it[0])));
  });
  openSheet({title: shortText(r.title, 60), body: [ul], foot: []});
}

/* ---------- edit (curator) ---------- */
function editSheet(r){
  var title = txt('edTitle', {value: r.title, maxlength: '120', required: true}), url = h('input', {type: 'url', id: 'edUrl', value: r.url, inputmode: 'url', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false'}),
      summary = txt('edSummary', {value: r.summary || '', maxlength: '280'}), coll = collField('edColl', r.collection || ''),
      tags = txt('edTags', {value: (r.tags || []).join(', '), placeholder: 'fall fest, events'}), owner = txt('edOwner', {value: r.owner_name || ''}),
      thumb = h('input', {type: 'url', id: 'edThumb', value: r.thumb_url || '', inputmode: 'url', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', placeholder: 'https://'});
  var err = h('p', {class: 'err', role: 'alert', hidden: true, id: 'edErr'});
  var go = h('button', {type: 'submit', class: 'primary', id: 'edGo', form: 'edForm', text: 'Save'});
  function fail(msg, el){ err.textContent = msg; err.hidden = false; if (el) el.focus(); }
  var form = h('form', {id: 'edForm', class: 'stack', novalidate: true, on: {submit: async function(ev){
    ev.preventDefault(); if (S.busy) return; err.hidden = true;
    var t = title.value.trim(), u = normUrl(url.value), th = thumb.value.trim();
    if (!t) return fail('Add a title.', title);
    if (!validUrl(u)) return fail('Paste a full link that starts with https://', url);
    if (th && !/^https:\/\//i.test(th)) return fail('The thumbnail link must start with https://', thumb);
    S.busy = true; go.disabled = true; go.textContent = 'Saving\u2026';
    try {
      await Data.update(r.id, {title: t, summary: summary.value.trim(), url: u, collection: coll.value(),
        tags: tags.value.split(',').map(function(x){ return x.trim(); }).filter(Boolean), owner_name: owner.value.trim(), thumb_url: th});
      closeSheet(); await refresh(); toast('Saved');
    } catch (e){
      go.disabled = false; go.textContent = 'Save';
      if (e && e.hint === 'auth') failToast(e); else fail(e.message || 'Something went wrong. Try again.', e.hint === 'HUB_BAD_URL' ? url : null);
    } finally { S.busy = false; }
  }}},
    field('edTitle', 'Title', title), field('edUrl', 'Link', url), field('edSummary', 'Summary', summary), coll.node,
    field('edTags', 'Tags', tags), field('edOwner', 'Owner', owner), field('edThumb', 'Thumbnail link', thumb), err);
  openSheet({title: 'Edit', body: [form], foot: [go]});
}

/* ---------- recently removed (curator) ---------- */
async function removedSheet(){
  var body = h('div', {class: 'stack', id: 'rmBody'}, skel(1));
  openSheet({title: 'Recently removed', body: [body], foot: []});
  var rows;
  try { rows = await Data.removed(SPACE); }
  catch (e){ if (e && e.hint === 'auth'){ failToast(e); return; } body.replaceChildren(h('p', {class: 'err', role: 'alert', text: e.message || 'Something went wrong. Try again.'})); return; }
  function draw(){
    body.replaceChildren();
    if (!rows.length){ body.appendChild(h('p', {class: 'muted', style: 'margin:0', text: 'Nothing removed lately.'})); return; }
    var ul = h('ul', {class: 'opts rm-list'});
    rows.forEach(function(x){
      ul.appendChild(h('li', {class: 'rm-row'},
        h('span', {class: 'rm-main'}, h('b', {text: x.title}), h('span', {class: 'meta', text: hostOf(x.url) + ' \u00b7 Removed ' + relDate(x.deleted_at)})),
        h('button', {type: 'button', 'data-restore': x.id, 'aria-label': 'Restore ' + x.title, on: {click: async function(){
          var b = this; b.disabled = true;
          try { await Data.restore(x.id); rows = rows.filter(function(y){ return y.id !== x.id; }); draw(); await refresh(); toast('Restored'); }
          catch (e){ b.disabled = false; failToast(e); }
        }}}, 'Restore')));
    });
    body.appendChild(ul);
  }
  draw();
}

boot();
})();

</script>
